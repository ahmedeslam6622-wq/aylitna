<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عيلتنا">
<meta name="theme-color" content="#ffffff">
<title>عيلتنا · Our Family</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FAF8F3;--bg2:#F3EFE7;--card:#FFF;--card2:#FDF9F5;
  --pri:#C4622D;--pri-light:#FAECE7;--pri-dark:#A04E22;
  --txt:#1A1208;--txt2:#7A6A5A;--txt3:#B8A898;
  --bd:#EAE2D6;--bd2:#DDD4C4;
  --accent:#E8A87C;--shadow:rgba(196,98,45,.12);--shadow2:rgba(26,18,8,.08);
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;--yellow:#F59E0B;
  --r:18px;--r2:12px;--r3:8px;
  --font-d:'Lora',Georgia,serif;--font-b:'Nunito',-apple-system,sans-serif;
  --fs:15px;--fs-sm:13px;--fs-xs:11px;--fs-lg:17px;--fs-xl:22px;
  --tr:0.18s cubic-bezier(0.4,0,0.2,1);--nav-h:68px;
}
[data-theme="midnight"]{--bg:#0F0E17;--bg2:#1A1826;--card:#1E1D2E;--card2:#252438;--pri:#8B5CF6;--pri-light:#2D1F4E;--pri-dark:#7C3AED;--txt:#F4F3FF;--txt2:#9B98C5;--txt3:#5C5A7A;--bd:#2D2B45;--bd2:#3A3860;--accent:#C4B5FD;--shadow:rgba(139,92,246,.18);--shadow2:rgba(0,0,0,.35);--green:#34D399;--red:#F87171;}
[data-theme="rose"]{--bg:#FFF5F7;--bg2:#FFE8ED;--card:#FFF;--card2:#FFF0F3;--pri:#E11D6A;--pri-light:#FFE4EE;--pri-dark:#BE185D;--txt:#1A0A10;--txt2:#7A4055;--txt3:#C49AAA;--bd:#F5CEDD;--bd2:#EDADC3;--shadow:rgba(225,29,106,.12);--shadow2:rgba(26,10,16,.08);}
[data-theme="forest"]{--bg:#F4F7F2;--bg2:#E8F0E4;--card:#FFF;--card2:#F0F5EE;--pri:#2D7A3A;--pri-light:#E0F2E3;--pri-dark:#1F5C2A;--txt:#0D1A10;--txt2:#4A6B50;--txt3:#9AB8A0;--bd:#C8DEC9;--bd2:#B0CEB4;--shadow:rgba(45,122,58,.12);--shadow2:rgba(13,26,16,.08);}
[data-theme="ocean"]{--bg:#F0F6FF;--bg2:#E0EEFF;--card:#FFF;--card2:#EBF3FF;--pri:#1A6FC4;--pri-light:#DCEEFF;--pri-dark:#135BA0;--txt:#071525;--txt2:#3A5A7A;--txt3:#8AAAC5;--bd:#C2D8EF;--bd2:#A8C4E0;--shadow:rgba(26,111,196,.12);--shadow2:rgba(7,21,37,.08);}
[data-theme="sand"]{--bg:#FBF7EE;--bg2:#F2EAD8;--card:#FFF;--card2:#FDF8F0;--pri:#8B6914;--pri-light:#FDF1D0;--pri-dark:#6B500F;--txt:#1A1408;--txt2:#6B5A3A;--txt3:#B8A878;--bd:#E2D5B8;--bd2:#CFC0A0;--shadow:rgba(139,105,20,.12);--shadow2:rgba(26,20,8,.08);}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font-b);color:var(--txt);font-size:var(--fs)}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;max-width:540px;margin:0 auto;background:var(--bg);transition:background var(--tr),color var(--tr);padding:0 3px;}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:var(--font-b);-webkit-tap-highlight-color:transparent}
input,textarea{font-family:var(--font-b)}
.scrollx{overflow-x:auto;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}

/* HEADER */
.hdr{background:var(--card);border-bottom:1.5px solid var(--bd);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0;position:relative;z-index:10;box-shadow:0 2px 12px var(--shadow2);}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.brand-arabic{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--pri);line-height:1}
.brand-eng{font-size:var(--fs-xs);color:var(--txt3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;vertical-align:middle;margin-left:5px;position:relative;top:-1px;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.brand-dot.off{background:var(--txt3);box-shadow:none}
.hdr-right{display:flex;align-items:center;gap:8px}
.new-badge{background:var(--pri);color:#fff;border-radius:20px;padding:3px 10px;font-size:var(--fs-xs);font-weight:800;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .2s}
.icon-btn:active{transform:scale(.9)}

/* SEARCH BAR */
.search-bar{padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0;display:none}
.search-bar.show{display:block}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:30px;padding:8px 14px}
.search-inner input{flex:1;background:none;border:none;outline:none;font-size:var(--fs-sm);color:var(--txt)}
.search-inner input::placeholder{color:var(--txt3)}
.search-clear{background:none;border:none;font-size:16px;color:var(--txt3);padding:0}

/* PILLS */
.pills-wrap{background:var(--card);border-bottom:1.5px solid var(--bd);padding:8px 14px;flex-shrink:0}
.pills{display:flex;gap:6px}
.pill{padding:7px 15px;border-radius:30px;border:1.5px solid var(--bd);font-size:var(--fs-sm);color:var(--txt2);white-space:nowrap;background:transparent;font-weight:600;transition:all .18s;flex-shrink:0}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill:active{transform:scale(.95)}

/* REMINDER */
.reminder{background:linear-gradient(135deg,var(--pri-light),var(--bg2));border-bottom:1.5px solid var(--bd2);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.reminder-txt{flex:1;font-size:var(--fs-sm);color:var(--pri-dark);line-height:1.45;font-weight:600}
.reminder-share{background:var(--pri);border:none;border-radius:20px;padding:7px 14px;font-size:var(--fs-xs);font-weight:800;color:#fff;white-space:nowrap}
.reminder-share:active{transform:scale(.95)}
.reminder-close{background:none;border:none;font-size:18px;color:var(--txt3);padding:4px}

/* MAIN */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;position:relative;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.main::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.content{padding:14px 10px 20px;display:flex;flex-direction:column;gap:14px}

/* CARD */
.card{background:var(--card);border-radius:var(--r);border:1.5px solid var(--bd);overflow:visible;transition:border-color .3s;box-shadow:0 2px 10px var(--shadow2);animation:card-in .35s cubic-bezier(.34,1.2,.64,1) both;position:relative}
.card.is-new{border-color:var(--accent)}
.card.pinned{border-color:var(--yellow);box-shadow:0 2px 16px rgba(245,158,11,.2)}
@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pin-banner{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-bottom:1px solid #F59E0B;padding:5px 14px;font-size:var(--fs-xs);font-weight:800;color:#92400E;display:flex;align-items:center;gap:5px;border-radius:var(--r) var(--r) 0 0}
.card-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border-width:2px;border-style:solid;flex-shrink:0;font-family:var(--font-d)}
.av-sm{width:28px;height:28px;font-size:11px;border-width:1.5px}
.av-xs{width:22px;height:22px;font-size:10px;border-width:1.5px}
.cname{font-size:var(--fs);font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.ctime{font-size:var(--fs-xs);color:var(--txt3);margin-top:1px;cursor:pointer}
.oct-tag{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.more-btn{width:32px;height:32px;border-radius:50%;background:none;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt3);transition:background .2s;margin-left:auto;flex-shrink:0}
.more-btn:active{background:var(--bg2)}
.post-img-wrap{position:relative;overflow:hidden;background:var(--bg2);border-radius:0}
.post-img{width:100%;max-height:380px;object-fit:cover;cursor:pointer;transition:transform .3s;display:block}
.post-img:active{transform:scale(.99)}
.img-overlay-btns{position:absolute;bottom:10px;right:10px;display:flex;gap:6px}
.img-overlay-btn{background:rgba(0,0,0,.55);border:none;border-radius:var(--r2);padding:7px 12px;color:#fff;font-size:var(--fs-xs);font-weight:700;backdrop-filter:blur(4px)}
.no-img{height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid;border-bottom:1px solid}
.no-img-txt{font-size:var(--fs-sm);font-weight:700}
.caption{padding:10px 14px 6px;font-size:var(--fs);line-height:1.65;color:var(--txt);font-family:var(--font-d)}
.caption strong{font-weight:700}.caption em{font-style:italic}
.mention{color:var(--pri);font-weight:700;cursor:pointer}
.seen-by{padding:4px 14px 6px;font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:5px}
.seen-avatars{display:flex;gap:-4px}
.seen-av{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;margin-right:-4px}

/* REACTIONS */
.rxn-wrap{padding:8px 14px 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rxn-pill{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:30px;border:1.5px solid var(--bd);background:var(--bg2);font-size:var(--fs-sm);font-weight:700;color:var(--txt2);transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s;position:relative;user-select:none;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}
.rxn-pill.mine{background:var(--pri-light);border-color:var(--pri);color:var(--pri)}
.rxn-pill:active{transform:scale(.88) translateZ(0)}
.rxn-pill.pop{animation:rxn-pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes rxn-pop{0%{transform:scale(1) translateZ(0)}50%{transform:scale(1.25) translateZ(0)}100%{transform:scale(1) translateZ(0)}}
.rxn-emoji{font-size:17px;line-height:1}
.rxn-count{font-size:var(--fs-xs);font-weight:800;min-width:12px;text-align:center}
.rxn-who{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.85);background:#1A1208;color:#fff;border-radius:var(--r3);padding:6px 11px;font-size:var(--fs-xs);white-space:normal;word-break:break-word;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.4);width:max-content;max-width:160px;line-height:1.4}
.rxn-pill:hover .rxn-who,.rxn-pill.show-who .rxn-who{opacity:1;transform:translateX(-50%) scale(1)}
.rxn-add-row{display:flex;gap:2px;padding:0 10px 8px;flex-wrap:wrap}
.rxn-add-btn{padding:5px 7px;font-size:20px;line-height:1;background:none;border:none;border-radius:var(--r3);transition:transform .12s,background .12s;will-change:transform;transform:translateZ(0)}
.rxn-add-btn:active{transform:scale(.8) translateZ(0);background:var(--bg2)}

/* COMMENTS */
.comments-section{border-top:1px solid var(--bd)}
.comments-toggle{display:flex;align-items:center;gap:6px;padding:10px 14px;background:none;border:none;width:100%;text-align:left;font-size:var(--fs-sm);font-weight:700;color:var(--txt2);transition:color .15s}
.comments-toggle:active{color:var(--pri)}
.comments-toggle-ico{font-size:13px;transition:transform .2s}
.comments-toggle.open .comments-toggle-ico{transform:rotate(90deg)}
.cmt-badge{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:1px 7px;font-size:var(--fs-xs);font-weight:800;color:var(--txt2)}
.cmt-new-dot{width:7px;height:7px;border-radius:50%;background:var(--pri);margin-left:2px;animation:pop .3s ease}
.comments-body{display:none;padding:0 0 4px}
.comments-body.open{display:block}
.comment{display:flex;gap:8px;padding:8px 12px 4px;animation:cmt-in .2s ease both}
@keyframes cmt-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.comment.reply{padding-left:40px}
.comment.reply-l2{padding-left:64px}
.comment-body{flex:1;min-width:0}
.comment-bubble{background:var(--bg2);border-radius:0 var(--r) var(--r) var(--r);padding:9px 12px;font-size:var(--fs-sm);line-height:1.6;border:1px solid var(--bd)}
.comment-name{font-size:var(--fs-xs);font-weight:800;color:var(--pri);margin-bottom:3px}
.comment-txt{color:var(--txt);word-break:break-word}
.comment-img{margin-top:7px;border-radius:var(--r2);max-height:160px;object-fit:cover;cursor:pointer}
.comment-meta{display:flex;align-items:center;gap:8px;padding:4px 2px;flex-wrap:wrap}
.comment-time{font-size:var(--fs-xs);color:var(--txt3)}
.comment-action{font-size:var(--fs-xs);font-weight:700;color:var(--txt3);background:none;border:none;padding:2px 4px;border-radius:4px;transition:color .15s}
.comment-action:active{color:var(--pri)}
.comment-rxn-row{display:flex;gap:2px;align-items:center;margin-left:auto}
.comment-rxn{font-size:13px;padding:2px 3px;background:none;border:none;border-radius:4px;transition:transform .12s;will-change:transform;transform:translateZ(0)}
.comment-rxn:active{transform:scale(.75) translateZ(0)}
.cmt-img-preview{position:relative;display:inline-block;margin:4px 12px}
.cmt-img-preview img{width:80px;height:80px;object-fit:cover;border-radius:var(--r2);border:2px solid var(--bd)}
.cmt-img-rm{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;display:flex;align-items:center;justify-content:center}
.load-more-cmt{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:none;border:none;width:100%;font-size:var(--fs-sm);font-weight:700;color:var(--pri);border-top:1px solid var(--bd);transition:background .15s}
.load-more-cmt:active{background:var(--pri-light)}
.comment-input-wrap{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 10px;border-top:1px solid var(--bd);background:var(--card)}
.comment-input-inner{flex:1;position:relative}
.comment-input{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:22px;padding:9px 40px 9px 14px;font-size:var(--fs-sm);color:var(--txt);outline:none;resize:none;max-height:80px;line-height:1.4;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.comment-input:focus{border-color:var(--pri)}
.comment-img-btn{position:absolute;right:8px;bottom:8px;background:none;border:none;font-size:18px;padding:2px;opacity:.5;transition:opacity .15s}
.comment-img-btn:active{opacity:1}
.comment-send{width:38px;height:38px;border-radius:50%;background:var(--pri);border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;transition:transform .15s,opacity .2s;opacity:.4}
.comment-send.active{opacity:1}
.comment-send:active{transform:scale(.9)}
.replying-to{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--pri-light);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:var(--fs-xs);color:var(--pri);font-weight:700}
.replying-to button{background:none;border:none;font-size:14px;color:var(--pri);padding:0;margin-left:auto}
.sent-flash{animation:sent-flash .4s ease}
@keyframes sent-flash{0%{background:var(--pri-light)}100%{background:var(--card)}}

/* CONTEXT MENU */
.ctx-menu{position:absolute;right:10px;top:48px;background:var(--card);border:1.5px solid var(--bd);border-radius:var(--r2);box-shadow:0 8px 28px var(--shadow);z-index:30;min-width:170px;overflow:hidden;animation:ctx-in .15s ease}
@keyframes ctx-in{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:var(--fs-sm);font-weight:700;color:var(--txt);background:none;border:none;width:100%;text-align:left;transition:background .15s}
.ctx-item:active{background:var(--bg2)}
.ctx-item.danger{color:var(--red)}
.ctx-item-ico{font-size:16px;width:20px;text-align:center}

/* NAV */
.nav{background:var(--card);border-top:1.5px solid var(--bd);display:flex;align-items:center;justify-content:space-around;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));flex-shrink:0;box-shadow:0 -2px 12px var(--shadow2);min-height:var(--nav-h)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:4px 10px;position:relative;flex:1;max-width:72px;transition:transform .15s}
.nav-btn:active{transform:scale(.9)}
.nav-ico{width:36px;height:36px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .2s}
.nav-ico.active{background:var(--pri-light)}
.nav-lbl{font-size:10px;color:var(--txt3);font-weight:700;transition:color .2s}
.nav-lbl.active{color:var(--pri)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--pri);border:none;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 4px 18px var(--shadow),0 0 0 4px var(--pri-light);transition:transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.fab:active{transform:scale(.92)}
.unread-badge{position:absolute;top:0;right:4px;background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:800;border:2px solid var(--card);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}

/* FULLSCREEN */
.fullscreen{position:absolute;inset:0;background:rgba(0,0,0,.97);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.fullscreen.show{display:flex}
.fs-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:16px}
.fs-close{background:rgba(255,255,255,.15);border:none;border-radius:var(--r2);padding:8px 16px;color:#fff;font-size:var(--fs-sm);font-weight:700}
.fs-save{background:var(--pri);border:none;border-radius:var(--r2);padding:8px 16px;color:#fff;font-size:var(--fs-sm);font-weight:700}
.fs-img{max-width:100%;max-height:72vh;border-radius:var(--r);object-fit:contain}
.fs-meta{color:rgba(255,255,255,.85);font-family:var(--font-d);font-size:var(--fs-lg);font-weight:700;margin-top:16px;text-align:center}
.fs-cap{color:rgba(255,255,255,.55);font-size:var(--fs-sm);margin-top:6px;text-align:center;line-height:1.6;max-width:340px}

/* ADD SCREEN */
.add-wrap{padding:16px 16px calc(30px + var(--nav-h))}
.page-ttl{font-family:var(--font-d);font-size:var(--fs-xl);font-weight:700;margin-bottom:18px;color:var(--txt)}
.posting-as{background:var(--bg2);border:1.5px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.pa-lbl{font-size:var(--fs-xs);color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pa-name{font-size:var(--fs-lg);font-weight:800;color:var(--txt);margin-top:2px}

function compress(file,maxW=1200){

async function loadPosts(){

  if(!error)posts=data||[];

async function loadMessages(){
  if(!USE_SB){messages=lsj('ayl_msgs',[]);return}
  const{data,error}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(!error)messages=data||[];
}
async function loadComments(pid){
  if(!USE_SB){comments[pid]=[];return}
  const{data,error}=await sb.from('comments').select('*').eq('post_id',pid).order('created_at',{ascending:true});
  if(!error)comments[pid]=data||[];
}
async function loadAllCmtCounts(){
  if(!USE_SB)return;
  const{data,error}=await sb.from('comments').select('post_id');
  if(error||!data)return;
  const counts={};
  data.forEach(r=>{counts[r.post_id]=(counts[r.post_id]||0)+1});
  Object.entries(counts).forEach(([pid,cnt])=>{
    if(!comments[pid]||comments[pid].every(c=>c._ph)){
      comments[pid]=Array(cnt).fill(null).map((_,i)=>({
        id:`ph-${pid}-${i}`,post_id:pid,parent_id:null,name:'',text:'',
        reactions:{},created_at:new Date().toISOString(),_ph:true
      }));
    }
  });
}
async function addPost(name,caption,photoURL,oct){
  const p={id:Date.now()+'',name,caption,photo_url:photoURL,oct,created_at:new Date().toISOString(),reactions:{}};
  if(!USE_SB){posts.unshift(p);lssj('ayl_posts',posts);return}
  await sb.from('posts').insert({name,caption,photo_url:photoURL,oct,reactions:{}});
}
async function updateRxn(pid,rxn){
  if(!USE_SB){const p=posts.find(p=>p.id===pid);if(p)p.reactions=rxn;lssj('ayl_posts',posts);return}
  await sb.from('posts').update({reactions:rxn}).eq('id',pid);
}
async function deletePost(id){
  if(!USE_SB){posts=posts.filter(p=>p.id!==id);lssj('ayl_posts',posts);render();return}
  await sb.from('posts').delete().eq('id',id);
}
async function addComment(pid,parentId,text,photoURL){
  const c={id:Date.now()+'c',post_id:pid,parent_id:parentId||null,name:myName,text,photo_url:photoURL||null,reactions:{},created_at:new Date().toISOString()};
  if(!comments[pid])comments[pid]=[];
  comments[pid]=comments[pid].filter(c=>!c._ph);
  comments[pid].push(c);
  if(!USE_SB){lssj('ayl_comments_'+pid,comments[pid]);return}
  await sb.from('comments').insert({post_id:pid,parent_id:parentId||null,name:myName,text,photo_url:photoURL||null,reactions:{}});
}
async function updateCmtRxn(pid,cid,rxn){
  if(!USE_SB){const c=(comments[pid]||[]).find(c=>c.id===cid);if(c)c.reactions=rxn;return}
  await sb.from('comments').update({reactions:rxn}).eq('id',cid);
}
async function delComment(pid,cid){
  comments[pid]=(comments[pid]||[]).filter(c=>c.id!==cid&&c.parent_id!==cid);
  repaintCmts(pid);
  if(!USE_SB){lssj('ayl_comments_'+pid,comments[pid]);return}
  await sb.from('comments').delete().eq('id',cid);

async function sendMsg(text){

  if(!USE_SB){messages.push(m);lssj('ayl_msgs',messages);repaintChat();scrollChat();return}

async function uploadPhoto(dataURL){
  if(!CLD_CLOUD)return dataURL;
  try{
    const fd=new FormData();fd.append('file',dataURLtoBlob(dataURL));fd.append('upload_preset',CLD_PRESET);
    const r=await fetch(`https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`,{method:'POST',body:fd});
    const d=await r.json();return d.secure_url||dataURL;

/* ─── REALTIME ───────────────────────────────────────────────────── */
function subscribeRealtime(){
  if(!USE_SB)return;
  sb.channel('posts').on('postgres_changes',{event:'*',schema:'public',table:'posts'},async()=>{
    await loadPosts();nameColors={};
    if(view==='feed')showNewBanner();
  }).subscribe();
  sb.channel('msgs').on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{
    await loadMessages();
    if(view==='chat'){repaintChat();scrollChat()}
    else{
      const n=messages.filter(m=>new Date(m.created_at).getTime()>lastMsgSeen&&!isOwn(m.name));
      if(n.length){unreadMsgs+=n.length;repaintNav()}
    }
  }).subscribe();
  sb.channel('cmts').on('postgres_changes',{event:'*',schema:'public',table:'comments'},async(payload)=>{
    const pid=payload.new?.post_id||payload.old?.post_id;
    if(pid){
      await loadComments(pid);repaintCmts(pid);repaintCmtBadge(pid);
      // Mark new comment dot if not currently viewing that post's comments
      if(!openComments[pid]&&payload.eventType==='INSERT'&&!isOwn(payload.new?.name||'')){
        newCmtPosts[pid]=true;repaintCmtBadge(pid);
      }
    }
  }).subscribe();
}

/* ─── PUSH ───────────────────────────────────────────────────────── */
function b64(b){
  const p='='.repeat((4-b.length%4)%4);
  const s=(b+p).replace(/-/g,'+').replace(/_/g,'/');
  const r=atob(s);const o=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;
}
async function initNotifs(){
  if(!('Notification'in window)||!('serviceWorker'in navigator))return;
  const p=await Notification.requestPermission();if(p!=='granted')return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    if(USE_SB&&sub){
      const j=sub.toJSON();
      await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,auth:j.keys.auth,p256dh:j.keys.p256dh},{onConflict:'endpoint'});
    }
  }catch(e){console.log('Push:',e)}
}

/* ─── BIRTHDAY CHECKER ───────────────────────────────────────────── */
function checkBirthdays(){
  const bday=posts.filter(p=>p.oct==='birthday');
  if(!bday.length)return;
  const today=new Date();
  bday.forEach(p=>{
    const d=new Date(p.created_at);
    if(d.getMonth()===today.getMonth()&&d.getDate()===today.getDate()){
      const key='bday_notif_'+p.id+'_'+today.getFullYear();
      if(!ls(key)){
        setTimeout(()=>{toast(`🎂 Today is a birthday! Check ${p.name}'s post`,4000)},2000);
        lss(key,'1');
      }
    }
  });
}

function buildCmt(pid,cmt,all,depth){
  if(depth>2)return'';
  const c=getC(cmt.name);
  const replies=all.filter(r=>r.parent_id===cmt.id);
  const rxn=cmt.reactions||{};
  const rxnHtml=CMT_RXN.map(e=>{
    const names=rxn[e]||[];const mine=names.includes(myName);
    return`<button class="comment-rxn${mine?' mine':''}" onclick="doCmtRxn('${pid}','${cmt.id}','${e}',this)"
      style="${mine?'opacity:1':'opacity:0.45'}">${e}${names.length?` <span style="font-size:9px;font-weight:800">${names.length}</span>`:''}</button>`;
  }).join('');
  const dc=depth===1?'reply':depth===2?'reply-l2':'';
  return`<div class="comment${dc?' '+dc:''}" id="cm-${cmt.id}">
    <div class="av av-xs" style="background:${c.bg};border-color:${c.br};color:${c.tx};flex-shrink:0;align-self:flex-start;margin-top:4px">${cmt.name[0].toUpperCase()}</div>
    <div class="comment-body">
      <div class="comment-bubble">
        <div class="comment-name">${cmt.name}</div>
        <div class="comment-txt">${rich(cmt.text)}</div>
        ${cmt.photo_url?`<img class="comment-img" src="${cmt.photo_url}" loading="lazy" onclick="openImgViewer('${cmt.photo_url}')">`:''}
      </div>
      <div class="comment-meta">
        <span class="comment-time">${ago(cmt.created_at)}</span>
        ${depth<2?`<button class="comment-action" onclick="setReply('${pid}','${cmt.id}','${cmt.name}')">↩ Reply</button>`:''}
        ${isOwn(cmt.name)?`<button class="comment-action" onclick="delComment('${pid}','${cmt.id}')" style="color:var(--red)">Delete</button>`:''}
        <div class="comment-rxn-row">${rxnHtml}</div>
      </div>
    </div>
  </div>${replies.map(r=>buildCmt(pid,r,all,depth+1)).join('')}`;
}

function buildMsgList(){
  if(!messages.length)return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:var(--txt2)">
    <div style="font-size:40px;margin-bottom:12px">💬</div>
    <div style="font-size:var(--fs-lg);font-weight:700;color:var(--txt);margin-bottom:6px">Family Chat</div>
    <div style="font-size:var(--fs-sm)">Send the first message!</div></div>`;
  let html='',lastDay='';
  messages.forEach(m=>{
    const day=fmtDay(m.created_at);
    if(day!==lastDay){html+=`<div class="day-divider">${day}</div>`;lastDay=day}
    const own=isOwn(m.name),c=getC(m.name);
    html+=`<div class="msg-row${own?' own':''}">
      ${!own?`<div class="av av-sm" style="background:${c.bg};border-color:${c.br};color:${c.tx}">${m.name[0].toUpperCase()}</div>`:''}
      <div class="msg-body-wrap">
        ${!own?`<div class="msg-sender">${m.name}</div>`:''}
        <div class="msg-bubble">${rich(m.text)}${own?`<button onclick="delMsg('${m.id}')" style="background:none;border:none;color:rgba(255,255,255,.35);font-size:10px;cursor:pointer;margin-left:8px;padding:0;vertical-align:middle">✕</button>`:''}</div>
        <div class="msg-time">${fmtTime(m.created_at)}</div>
      </div>
    </div>`;
  });
  return html;
}

/* Reactions */
function doRxn(pid,emoji,btn){
  const name=myName||'You',p=posts.find(p=>p.id===pid);if(!p)return;
  const rxn={...(p.reactions||{})};
  rxn[emoji]=rxn[emoji]?[...rxn[emoji]]:[];
  const i=rxn[emoji].indexOf(name);
  if(i>-1){rxn[emoji].splice(i,1);if(!rxn[emoji].length)delete rxn[emoji]}
  else{rxn[emoji].push(name);vibrate(15)}
  p.reactions=rxn;
  btn.classList.add('pop');btn.addEventListener('animationend',()=>btn.classList.remove('pop'),{once:true});
  const card=document.getElementById('post-'+pid);
  if(card){
    const rw=card.querySelector('.rxn-wrap'),ra=card.querySelector('.rxn-add-row');
    if(rw&&ra){const tmp=document.createElement('div');tmp.innerHTML=buildRxns(p);rw.replaceWith(tmp.children[0]);ra.replaceWith(tmp.children[0])}
  }
  updateRxn(pid,rxn);
}

function hideWho(btn){btn.classList.remove('show-who')}
let whoT=null;
function showWhoTouch(btn){clearTimeout(whoT);btn.classList.add('show-who');whoT=setTimeout(()=>btn.classList.remove('show-who'),2500)}

/* Comments */
async function toggleCmts(pid){
  const was=openComments[pid];openComments[pid]=!was;
  if(!was){
    const hasph=(comments[pid]||[]).some(c=>c._ph);
    if(!comments[pid]||hasph)await loadComments(pid);
    newCmtPosts[pid]=false;
  }
  const p=posts.find(p=>p.id===pid);if(!p)return;
  repaintCard(pid);
  if(!was)setTimeout(()=>document.getElementById('ci-'+pid)?.focus(),150);
}
function onCmtIn(el,pid){
  el.style.height='auto';el.style.height=el.scrollHeight+'px';
  if(!cmtDraft[pid])cmtDraft[pid]={text:'',photo:null,replyTo:null};
  cmtDraft[pid].text=el.value;
  const btn=document.getElementById('cs-'+pid);
  if(btn)btn.className='comment-send'+(el.value.trim()||cmtDraft[pid]?.photo?' active':'');
}
function setReply(pid,cid,name){
  if(!cmtDraft[pid])cmtDraft[pid]={text:'',photo:null,replyTo:null};
  cmtDraft[pid].replyTo={id:cid,name};
  repaintCmts(pid);setTimeout(()=>document.getElementById('ci-'+pid)?.focus(),100);
}
function clearReply(pid){if(cmtDraft[pid])cmtDraft[pid].replyTo=null;repaintCmts(pid)}
function attachCmtImg(pid){commentImgTarget=pid;document.getElementById('commentImgIn').click()}
function clearCmtImg(pid){if(cmtDraft[pid])cmtDraft[pid].photo=null;repaintCmts(pid)}
async function submitCmt(pid){
  const draft=cmtDraft[pid]||{};
  const text=(document.getElementById('ci-'+pid)?.value||draft.text||'').trim();
  if(!text&&!draft.photo)return;if(!myName)return;
  // Flash sent feedback
  const wrap=document.querySelector(`#cs-sec-${pid} .comment-input-wrap`);
  if(wrap)wrap.classList.add('sent-flash');
  let photoURL=null;
  if(draft.photo){
    document.getElementById('uploading').className='uploading-overlay show';
    photoURL=await uploadPhoto(draft.photo);
    document.getElementById('uploading').className='uploading-overlay';
  }
  await addComment(pid,draft.replyTo?.id||null,text,photoURL);
  cmtDraft[pid]={text:'',photo:null,replyTo:null};
  repaintCmts(pid);repaintCmtBadge(pid);
  toast('💬 Comment sent!');vibrate(20);
}
function doCmtRxn(pid,cid,emoji,btn){
  const name=myName||'You',cmt=(comments[pid]||[]).find(c=>c.id===cid);if(!cmt)return;
  const rxn={...(cmt.reactions||{})};rxn[emoji]=rxn[emoji]?[...rxn[emoji]]:[];
  const i=rxn[emoji].indexOf(name);
  if(i>-1){rxn[emoji].splice(i,1);if(!rxn[emoji].length)delete rxn[emoji]}else rxn[emoji].push(name);
  cmt.reactions=rxn;vibrate(10);
  btn.style.transform='scale(0.7)';requestAnimationFrame(()=>requestAnimationFrame(()=>{btn.style.transform='';btn.style.transition='transform .2s'}));
  updateCmtRxn(pid,cid,rxn);repaintCmts(pid);
}

/* New post banner */
function showNewBanner(){
  const main=document.querySelector('.main');if(!main)return;

/* Rich text */
function wrapTxt(b,a){const ta=document.getElementById('captIn');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;const sel=ta.value.substring(s,e)||'text';ta.value=ta.value.substring(0,s)+b+sel+a+ta.value.substring(e);ta.focus()}
function insertMention(n){const ta=document.getElementById('captIn');if(!ta)return;const p=ta.selectionStart;ta.value=ta.value.substring(0,p)+'@'+n+' '+ta.value.substring(p);ta.focus()}
function updateCharCount(el){const c=document.getElementById('charCount');if(!c)return;const n=el.value.length;c.textContent=`${n} / ${MAX_CAP}`;c.className='char-count'+(n>MAX_CAP?'over':n>MAX_CAP*.8?' warn':'')}
function checkSub(){const v=(document.getElementById('nameIn')?.value||'').trim();const b=document.getElementById('subBtn');if(b)b.disabled=!v}

/* Submit post */
async function submitPost(){
  const name=(showNameInput?(document.getElementById('nameIn')?.value||''):myName).trim();
  const caption=(document.getElementById('captIn')?.value||'').trim();
  if(!name||caption.length>MAX_CAP)return;
  document.getElementById('uploading').className='uploading-overlay show';
  try{
    let photoURL=null;if(draftPhoto)photoURL=await uploadPhoto(draftPhoto);
    await addPost(name,caption,photoURL,selOct);
    if(name!==myName){myName=name;lss('ayl_name',name)}
    draftPhoto=null;selOct='everyday';showNameInput=false;
    if(!USE_SB)await loadPosts();
    view='feed';render();toast('✨ Moment shared!');vibrate([20,10,20]);
  }catch(e){alert('Something went wrong. Please try again.')}
  finally{document.getElementById('uploading').className='uploading-overlay'}
}

  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';btn.style.opacity=inp.value.trim()?'1':'.4'});
}
function onChatIn(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';const btn=document.getElementById('chatSend');if(btn)btn.style.opacity=el.value.trim()?'1':'.4'}
function scrollChat(){setTimeout(()=>{const el=document.getElementById('chatMsgs');if(el)el.scrollTop=el.scrollHeight},60)}
function markSeen(){unreadMsgs=0;lastMsgSeen=Date.now();lss('ayl_msgseen',lastMsgSeen)}
async function sendChat(){
  const el=document.getElementById('chatIn');const txt=(el?.value||'').trim();
  if(!txt||!myName)return;
  el.value='';el.style.height='auto';const btn=document.getElementById('chatSend');if(btn)btn.style.opacity='.4';
  await sendMsg(txt);
}
async function delMsg(id){
  if(!confirm('Delete?'))return;
  if(!USE_SB){messages=messages.filter(m=>m.id!==id);lssj('ayl_msgs',messages);repaintChat();return}
  await sb.from('messages').delete().eq('id',id);await loadMessages();repaintChat();
}

/* Theme */
function openThemeSheet(){const el=document.getElementById('themeOverlay');if(el)el.className='sheet-overlay show'}
function closeSheet(e){if(e.target.id==='themeOverlay'){const el=document.getElementById('themeOverlay');if(el)el.className='sheet-overlay'}}
function setTheme(id){
  applyTheme(id);
  const grid=document.querySelector('.theme-grid');
  if(grid)grid.innerHTML=THEMES.map(t=>`<button class="theme-swatch" onclick="setTheme('${t.id}')">
    <div class="theme-circle${id===t.id?' active':''}" style="background:${t.bg};box-shadow:0 3px 10px rgba(0,0,0,.15)"><span style="font-size:20px">${t.e}</span></div>
    <div class="theme-name">${t.name}</div></button>`).join('');
}
function setFS(s){
  applyFS(s);
  document.querySelectorAll('.size-step').forEach(b=>{b.className='size-step'+(b.dataset.s===s?' active':'')});
}
function setupSheet(){document.querySelectorAll('.size-step').forEach((b,i)=>{b.dataset.s=['sm','md','lg'][i]})}

/* File inputs */
document.getElementById('galleryIn').onchange=async function(){const f=this.files[0];if(!f)return;draftPhoto=await compress(f);this.value='';if(view!=='add')view='add';render()};
document.getElementById('cameraIn').onchange=async function(){const f=this.files[0];if(!f)return;draftPhoto=await compress(f);this.value='';if(view!=='add')view='add';render()};
document.getElementById('commentImgIn').onchange=async function(){
  const f=this.files[0];if(!f||!commentImgTarget)return;
  const d=await compress(f,600);this.value='';
  if(!cmtDraft[commentImgTarget])cmtDraft[commentImgTarget]={text:'',photo:null,replyTo:null};
  cmtDraft[commentImgTarget].photo=d;
  const p=posts.find(p=>p.id===commentImgTarget);if(!p)return;
  repaintCmts(commentImgTarget);
};

/* SW */
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* Boot */
init();
</script>
