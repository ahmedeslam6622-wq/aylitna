<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عيلتنا">
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<title>عيلتنا · Our Family</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"></div>
<!-- Overlays -->
<div class="uploading-overlay" id="uploading">
  <div class="spinner"></div>
  <div class="uploading-txt">Sharing with family… ❤️</div>
  <div class="uploading-sub">Just a moment</div>
</div>

<div class="toast" id="toast"></div>
<!-- Call overlay: inner content is rebuilt by app.js (showCallScreen) so it
     can insert the Jitsi holder div dynamically. Left empty here on purpose. -->
<div class="call-overlay" id="callOverlay">
  <div class="call-bg" id="callBg"></div>
  <div class="call-inner"></div>
</div>

  <div class="nav-toast" id="navtoast">
    
<!-- File inputs -->
<input type="file" id="galleryIn" accept="image/*" style="display:none">
<input type="file" id="cameraIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="videoIn" accept="video/*" style="display:none">
<input type="file" id="commentImgIn" accept="image/*" style="display:none">
<input type="file" id="profilePicIn" accept="image/*" style="display:none">
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
