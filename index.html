<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Automatically switches the notch color based on user device preference -->
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عيلتنا">
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<title>عيلتنا · Our Family</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
</head>
<body>
  <!-- ══════════════════════════════════════════════════════
     PASSCODE GATE
     Place this as a sibling div, right before <div id="app">,
     inside your existing index.html <body>.
     Uses your app's own CSS variables — no new design system,
     it inherits the current theme automatically (including
     dark mode via [data-theme="midnight"] etc, since it reads
     the same --glass-bg / --pri / --bg vars your nav already uses).
     ══════════════════════════════════════════════════════ -->

<div id="gate" class="gate-overlay">
  <div class="gate-card">
    <div class="gate-icon">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>

    <div class="gate-title">عيلتنا</div>
    <div class="gate-sub">Enter the family passcode</div>

    <input
      type="password"
      id="passcodeInput"
      class="gate-input"
      placeholder="Passcode"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >

    <div id="passcodeError" class="gate-error"></div>

    <button id="passcodeSubmit" class="gate-btn">
      <span class="gate-btn-label">Unlock</span>
      <span class="gate-btn-spinner"></span>
    </button>
  </div>
</div>
<div id="app"></div>
<!-- Overlays -->
<div class="uploading-overlay" id="uploading">
  <div class="spinner"></div>
  <div class="uploading-txt">Sharing with family… ❤️</div>
  <div class="uploading-sub">Just a moment</div>
</div>
<div class="toast" id="toast"></div>
<!-- Call overlay: inner content is rebuilt by app.js (showCallScreen) so it
     can insert the Jitsi holder div dynamically. Left empty here on purpose. -->
<div class="call-overlay" id="callOverlay">
  <div class="call-bg" id="callBg"></div>
  <div class="call-inner"></div>
</div>
<!-- File inputs -->
<input type="file" id="galleryIn" accept="image/*" multiple style="display:none">
<input type="file" id="cameraIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="videoIn" accept="video/*" multiple style="display:none">
<input type="file" id="commentImgIn" accept="image/*" style="display:none">
<input type="file" id="profilePicIn" accept="image/*" style="display:none">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
