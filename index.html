*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#FAF8F3;--card:#FFF;--pri:#C4622D;--txt:#1A1208;--txt2:#9B8A78;--bd:#EAE2D6;--r:16px}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--txt)}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;max-width:500px;margin:0 auto;background:var(--bg)}

/* Header */
.hdr{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));flex-shrink:0}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.brand-sub{font-size:11px;color:var(--txt2);margin-top:1px}
.badge{background:#FAECE7;color:#7A3010;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-left:6px}

/* Reminder banner */
.reminder{background:linear-gradient(135deg,#FAECE7,#FDF4EE);border-bottom:1px solid #F0D8CC;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.reminder-txt{flex:1;font-size:13px;color:#7A3010;line-height:1.4}
.reminder-post{background:var(--pri);border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:#FFF;cursor:pointer;font-family:inherit;white-space:nowrap}
.reminder-close{background:none;border:none;cursor:pointer;color:#9B8A78;font-size:18px;padding:2px 4px}

/* Pills */
.pills{background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 14px;border-radius:20px;border:1px solid var(--bd);font-size:13px;color:var(--txt2);white-space:nowrap;cursor:pointer;background:transparent;font-family:inherit}
.pill.on{font-weight:600}

/* Content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.pad{padding:12px 12px 30px}

/* Card */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px;overflow:hidden}
.card-hdr{display:flex;align-items:center;gap:10px;padding:12px 13px 9px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border-width:2px;border-style:solid;flex-shrink:0}
.cname{font-size:14px;font-weight:600}
.ctime{font-size:11px;color:var(--txt2);margin-top:1px}
.oct-tag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.post-img{width:100%;max-height:320px;object-fit:cover;display:block;cursor:pointer}
.no-img{height:46px;display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid;border-bottom:1px solid}
.no-img-txt{font-size:12px;font-weight:600}
.caption{padding:9px 13px 5px;font-size:14px;line-height:1.6}
.rxn-row{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 10px;align-items:center}
.rxn-cnt{background:#F5F0E8;border:1px solid #DDD4C4;border-radius:20px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.rxn-btn{padding:3px 4px;font-size:19px;cursor:pointer;background:none;border:none;font-family:inherit;line-height:1}
.del-btn{padding:4px 6px;background:none;border:none;cursor:pointer;font-size:15px;margin-left:2px}

/* Nav */
.nav{background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px 16px;font-family:inherit;position:relative}
.nav-ico{font-size:24px;line-height:1}
.nav-lbl{font-size:10px;color:var(--txt2)}
.nav-lbl.on{color:var(--pri);font-weight:700}
.fab{width:52px;height:52px;border-radius:50%;background:var(--pri);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:30px;color:#FFF;line-height:1;box-shadow:0 4px 18px rgba(196,98,45,.38);margin-bottom:2px}
.chat-unread{position:absolute;top:2px;right:10px;background:#EF4444;color:#FFF;border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;scrollbar-width:none;display:flex;flex-direction:column}
.chat-msgs::-webkit-scrollbar{display:none}
.msg-row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.msg-row.own{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border-width:1.5px;border-style:solid;flex-shrink:0}
.msg-body{max-width:72%}
.msg-name{font-size:11px;color:var(--txt2);margin-bottom:3px}
.msg-row.own .msg-name{text-align:right}
.msg-bubble{padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-row:not(.own) .msg-bubble{background:#F0EDE8;border-bottom-left-radius:5px;color:var(--txt)}
.msg-row.own .msg-bubble{background:var(--pri);border-bottom-right-radius:5px;color:#FFF}
.msg-time{font-size:10px;color:var(--txt2);margin-top:3px}
.msg-row.own .msg-time{text-align:right}
.chat-input-wrap{background:var(--card);border-top:1px solid var(--bd);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.chat-input{flex:1;background:#F5F0E8;border:none;border-radius:22px;padding:10px 16px;font-size:15px;color:var(--txt);outline:none;font-family:inherit;resize:none;max-height:100px;line-height:1.4}
.chat-send{width:44px;height:44px;border-radius:50%;background:var(--pri);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFF;font-size:18px;flex-shrink:0}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;color:var(--txt2)}
.day-divider{text-align:center;margin:8px 0 14px;font-size:11px;color:var(--txt2);position:relative}
.day-divider::before,.day-divider::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--bd)}
.day-divider::before{left:0}.day-divider::after{right:0}

/* Onboarding */
.ob{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;background:var(--card);overflow-y:auto}
.ob-brand{font-size:42px;font-weight:700;letter-spacing:-1px;margin-bottom:4px}
.ob-title{font-size:16px;font-weight:600;margin-bottom:8px}
.ob-desc{font-size:13px;color:var(--txt2);line-height:1.65;margin-bottom:22px;max-width:300px}
.feat{display:flex;align-items:center;gap:12px;background:#F0EDE8;border-radius:12px;padding:13px;margin-bottom:8px;text-align:left;width:100%;max-width:320px}
.feat-ico{font-size:20px}
.feat-txt{font-size:13px}

/* Add screen */
.add-wrap{padding:16px 16px 40px}
.page-ttl{font-size:20px;font-weight:700;margin-bottom:18px}
.posting-as{background:#F5F0E8;border:1px solid #DEDAD0;border-radius:13px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.pa-label{font-size:11px;color:var(--txt2)}
.pa-name{font-size:16px;font-weight:700}
.change-btn{border:1px solid #D4CABC;border-radius:9px;padding:6px 12px;font-size:12px;color:#6B5E4F;background:none;cursor:pointer;font-family:inherit}
.photo-row{display:flex;gap:10px;margin-bottom:14px}
.photo-btn{flex:1;background:#F5F0E8;border:1px solid #DEDAD0;border-radius:13px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.photo-btn-ico{font-size:26px;line-height:1}
.photo-btn-txt{font-size:13px;font-weight:600;color:#4A3728}
.draft-wrap{margin-bottom:14px;border-radius:14px;overflow:hidden;position:relative}
.draft-img{width:100%;max-height:220px;object-fit:cover;display:block}
.remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);border:none;border-radius:8px;padding:5px 10px;color:#FFF;font-size:12px;cursor:pointer;font-family:inherit}
.oct-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.oct-row::-webkit-scrollbar{display:none}
.oct-btn{padding:8px 13px;border-radius:20px;border:1px solid #D4CABC;background:transparent;font-size:13px;color:var(--txt2);white-space:nowrap;cursor:pointer;font-family:inherit}
.oct-btn.on{border-color:#D85A30;background:#FAECE7;color:#7A3010}
.lbl{font-size:12px;font-weight:600;color:var(--txt2);display:block;margin-bottom:6px}
input,textarea{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;color:var(--txt);background:#FFF;border:1.5px solid var(--bd);border-radius:13px;padding:14px;width:100%;margin-bottom:14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:none;min-height:88px;line-height:1.5}
.btn{background:var(--pri);border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;color:#FFF;width:100%;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.35}

/* Members */
.member-card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.member-name{font-size:15px;font-weight:600}
.member-meta{font-size:12px;color:var(--txt2);margin-top:2px}
.streak{background:#FEF3C7;color:#92400E;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;margin-left:6px}

/* Fullscreen */
.full{position:absolute;inset:0;background:rgba(10,7,4,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px;padding-top:calc(20px + env(safe-area-inset-top))}
.full.show{display:flex}
.full-img{max-width:100%;max-height:72vh;border-radius:14px;object-fit:contain}
.close-btn{align-self:flex-end;background:rgba(255,255,255,.14);border:none;border-radius:10px;padding:8px 16px;color:#FFF;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:18px;font-family:inherit}
.full-name{color:#FFF;font-size:17px;font-weight:700;margin-top:16px;text-align:center}
.full-cap{color:rgba(255,255,255,.65);font-size:14px;margin-top:6px;text-align:center;line-height:1.55;max-width:320px}

/* Loading / Empty */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;padding:50px 20px;text-align:center}
.empty-ico{font-size:44px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:600;margin-bottom:6px}
.empty-desc{font-size:14px;color:var(--txt2);line-height:1.65}

/* Uploading overlay */
.uploading{position:absolute;inset:0;background:rgba(250,248,243,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;gap:12px}
.uploading.show{display:flex}
.uploading-txt{font-size:15px;font-weight:600;color:var(--txt)}
</style>

</head>

<script>
const VAPID_PUBLIC = 'BClsAtEWOVK95B0atTRO4d6-QacLuKZg_X5p6r3YXKaOI35BF7TsRR-NOPDnEC_omwyZQRiQtqgeZWmbs6hasUw';
// ═══════════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://ptpprauzusyrbrigfyji.supabase.co';   
const SUPABASE_KEY = 'sb_publishable_K4QVE01BB4XSfmUlemIJZQ_TyFDDR1H';   // your anon/public key
// ═══════════════════════════════════════════════════════════════════════════════




const USE_SB = !!(SUPABASE_URL && SUPABASE_KEY);
let sb = null;
if (USE_SB) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Constants ───────────────────────────────────────────────────────────────
const MC = [
  {bg:'#FAECE7',br:'#D85A30',tx:'#7A3010'},

  {id:'everyday',l:'Everyday',e:'💛',bg:'#FAEEDA',br:'#C47A10',tx:'#7A4A08'},
  {id:'birthday',l:'Birthday',e:'🎂',bg:'#FAECE7',br:'#D85A30',tx:'#7A3010'},
  {id:'eid',l:'Eid',e:'🌙',bg:'#EEEDFE',br:'#7A6AE0',tx:'#3A2AAA'},
  {id:'travel',l:'Travel',e:'✈️',bg:'#E6F1FB',br:'#378ADD',tx:'#0E4A8A'},
  {id:'together',l:'Together',e:'👨‍👩‍👧‍👦',bg:'#EAF3DE',br:'#5A9A1A',tx:'#2E5A08'},
  {id:'home',l:'Home',e:'🏡',bg:'#E1F5EE',br:'#1A9A65',tx:'#0A5A3A'},
];
const RXNS = ['❤️','😂','😍','👏','😢','🔥'];
const SAMPLE_POSTS = [
  {id:'s1',name:'Omar',caption:'Happy birthday Baba! 🎂 Love you always ❤️',photo_url:null,oct:'birthday',created_at:new Date(Date.now()-5*60000).toISOString(),reactions:{'❤️':['Mama'],'😍':['Sara']}},
  {id:'s2',name:'Mama',caption:'من بيتنا بالحب يا حبيبي 🏡',photo_url:null,oct:'home',created_at:new Date(Date.now()-2*3600000).toISOString(),reactions:{'❤️':['Omar','Sara']}},
  {id:'s3',name:'Sara',caption:"Miss you so much Baba, can't wait to visit! 💕",photo_url:null,oct:'everyday',created_at:new Date(Date.now()-27*3600000).toISOString(),reactions:{'😍':['Omar']}},
];

// ─── State ────────────────────────────────────────────────────────────────────
let posts=[], messages=[], myName='', lastSeen=0, filter=null, view='feed';
let draftPhoto=null, selOct='everyday', showNameIn=false, fullPost=null;
let reminderDismissed=false, chatInput='', loadingFeed=false, unreadMsgs=0, lastMsgSeen=0;

// ─── Helpers ──────────────────────────────────────────────────────────────────
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function colorOf(n){const ns=[...new Set(posts.map(p=>p.name))];const i=ns.indexOf(n);return MC[(i>=0?i:0)%MC.length]}
function octOf(id){return OCTS.find(o=>o.id===id)||OCTS[0]}
function isOwn(n){return myName&&myName.trim().toLowerCase()===n.trim().toLowerCase()}
function ago(iso){
  const d=Date.now()-new Date(iso).getTime();
  const m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);
  if(m<1)return'just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';
  if(dy===1)return'yesterday';return dy+'d ago';
}
function fmtTime(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function fmtDay(iso){
  const d=new Date(iso),now=new Date();
  if(d.toDateString()===now.toDateString())return'Today';
  const yes=new Date(now);yes.setDate(yes.getDate()-1);
  if(d.toDateString()===yes.toDateString())return'Yesterday';
  return d.toLocaleDateString([],{month:'long',day:'numeric'});
}
function dataURLtoBlob(dataURL){
  const[h,d]=dataURL.split(','),mime=h.match(/:(.*?);/)[1];
  const b=atob(d),arr=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)arr[i]=b.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1100,ratio=Math.min(MAX/img.width,MAX/img.height,1);
        const w=Math.round(img.width*ratio),h=Math.round(img.height*ratio);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.78));
      };img.src=ev.target.result;
    };r.readAsDataURL(file);
  });
}

// ─── Reminder logic ───────────────────────────────────────────────────────────
function getReminderMsg(){
  if(!myName||reminderDismissed)return null;
  const mine=posts.filter(p=>p.name===myName);
  if(!mine.length)return"You haven't shared anything yet — be the first! 📸";
  const days=(Date.now()-new Date(mine[0].created_at).getTime())/86400000;
  if(days>2)return`You haven't shared in ${Math.floor(days)} days — share a moment! 📸`;
  return null;
}

// ─── Data layer ───────────────────────────────────────────────────────────────
async function loadPosts(){
  if(!USE_SB){
    const saved=lsGet('ayl_posts');
    posts=saved?JSON.parse(saved):SAMPLE_POSTS;
    return;
  }
  const{data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100);
  if(!error)posts=data||[];
}

async function loadMessages(){
  if(!USE_SB){messages=JSON.parse(lsGet('ayl_msgs')||'[]');return}
  const{data,error}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(!error)messages=data||[];
}

async function savePostsLocal(){lsSet('ayl_posts',JSON.stringify(posts))}
async function saveMsgsLocal(){lsSet('ayl_msgs',JSON.stringify(messages))}

const CLOUDINARY_CLOUD = 'df618arjm'; // your cloud name
const CLOUDINARY_PRESET = 'zsz6vswy'; // your upload preset name

async function uploadPhoto(dataURL){
  if(!CLOUDINARY_CLOUD) return dataURL;
  try{
    const blob = dataURLtoBlob(dataURL);
    const fd = new FormData();
    fd.append('file', blob);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST',
      body: fd
    });
    const data = await res.json();
    return data.secure_url;
  } catch(e){ return dataURL; }
}
async function addPost(name,caption,photoURL,oct){
  const post={id:Date.now()+'',name,caption,photo_url:photoURL,oct,created_at:new Date().toISOString(),reactions:{}};
  if(!USE_SB){posts.unshift(post);savePostsLocal();return}
  await sb.from('posts').insert({name,caption,photo_url:photoURL,oct,reactions:{}});
}

async function updateReactions(postId,rxn){
  if(!USE_SB){const p=posts.find(p=>p.id===postId);if(p)p.reactions=rxn;savePostsLocal();render();return}
  await sb.from('posts').update({reactions:rxn}).eq('id',postId);
}

async function deletePost(id){
  if(!USE_SB){posts=posts.filter(p=>p.id!==id);savePostsLocal();render();return}
  await sb.from('posts').delete().eq('id',id);
}

async function sendMsg(text){
  const msg={id:Date.now()+'',name:myName,text,created_at:new Date().toISOString()};
  if(!USE_SB){messages.push(msg);saveMsgsLocal();renderChat();scrollChat();return}
  await sb.from('messages').insert({name:myName,text});
  
}

// ─── Realtime subscriptions ───────────────────────────────────────────────────
function subscribeRealtime(){
  if(!USE_SB)return;
  sb.channel('posts-channel')
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>{
      loadPosts().then(()=>render());
    })
    .subscribe();
  sb.channel('messages-channel')
    .on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{
      await loadMessages();
      if(view==='chat'){renderChat();scrollChat()}
      else{
        const newMsgs=messages.filter(m=>new Date(m.created_at).getTime()>lastMsgSeen&&!isOwn(m.name));
        unreadMsgs+=newMsgs.length;
        render();
      }
    })
    .subscribe();
}
    

function urlB64ToUint8(b){
  const p='='.repeat((4-b.length%4)%4);
  const s=(b+p).replace(/-/g,'+').replace(/_/g,'/');
  const r=atob(s);const o=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;
}
async function initNotifs(){
  if(!('Notification'in window)||!('serviceWorker'in navigator))return;
  const p=await Notification.requestPermission();
  if(p!=='granted')return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)
    });
    if(USE_SB&&sub){
      const j=sub.toJSON();
      await sb.from('push_subscriptions').upsert({
        endpoint:j.endpoint,auth:j.keys.auth,p256dh:j.keys.p256dh
      },{onConflict:'endpoint'});
    }
  }catch(e){console.log('Push failed:',e);}
}

function showNotif(title, body) {
  if(document.visibilityState === 'visible') return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  navigator.serviceWorker.ready.then(reg => {
    reg.showNotification(title, { body, icon: '/icon.png' });
  }).catch(() => {});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init(){
  myName=lsGet('ayl_name')||'';
  if(myName) initNotifs();
  lastSeen=+(lsGet('ayl_seen')||0);
  lastMsgSeen=+(lsGet('ayl_msgseen')||0);
  lsSet('ayl_seen',String(Date.now()));
  loadingFeed=true;render();
  await Promise.all([loadPosts(),loadMessages()]);
  loadingFeed=false;
  subscribeRealtime();
  render();
  if(view==='chat'){scrollChat()}
}
// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!myName){renderOnboarding(app);return}
  const memberNames=[...new Set(posts.map(p=>p.name))];
  const newPosts=posts.filter(p=>new Date(p.created_at).getTime()>lastSeen).length;
  const rem=getReminderMsg();

  const hdr=`<div class="hdr">
    <div class="hdr-row">
      <div><div class="brand">عيلتنا ${USE_SB?'<span class="online-dot"></span>':''}</div><div class="brand-sub">Our Family</div></div>
      ${newPosts>0&&view==='feed'?`<div class="badge">${newPosts} new</div>`:''}
    </div>
  </div>`;

  const reminderHtml=rem&&view==='feed'?`<div class="reminder">
    <div class="reminder-txt">${rem}</div>
    <button class="reminder-post" onclick="goView('add')">Share now</button>
    <button class="reminder-close" onclick="reminderDismissed=true;render()">✕</button>
  </div>`:'';

  const pillsHtml=memberNames.length>1&&view==='feed'?`<div class="pills">
    ${['All',...memberNames].map(n=>{
      const a=n==='All'?!filter:filter===n;
      const c=n==='All'?null:colorOf(n);
      return`<button class="pill${a?' on':''}" onclick="setF('${n}')"
        style="${a&&c?`background:${c.bg};border-color:${c.br};color:${c.tx}`:a?`background:#EDE8DF;border-color:#999;color:#333`:''}">${n}</button>`;
    }).join('')}
  </div>`:'';

  const nav=`<div class="nav">
    <button class="nav-btn" onclick="goView('feed')">
      <span class="nav-ico">${view==='feed'?'🏠':'🏡'}</span>
      <span class="nav-lbl${view==='feed'?' on':''}">Home</span>
    </button>
    <button class="fab" onclick="goView('add')">+</button>
    <button class="nav-btn" onclick="goView('chat');markMsgsSeen()">
      <span class="nav-ico">💬</span>
      <span class="nav-lbl${view==='chat'?' on':''}">Chat</span>
      ${unreadMsgs>0&&view!=='chat'?`<span class="chat-unread">${unreadMsgs}</span>`:''}
    </button>
    <button class="nav-btn" onclick="goView('members')">
      <span class="nav-ico">👨‍👩‍👧‍👦</span>
      <span class="nav-lbl${view==='members'?' on':''}">Family</span>
    </button>
  </div>`;

  const full=`<div class="full${fullPost?' show':''}" id="full">${fullPost?`
    <button class="close-btn" onclick="setFull(null)">✕  Close</button>
    ${fullPost.photo_url?`<img class="full-img" src="${fullPost.photo_url}" alt="">`:''}
    <div class="full-name">${fullPost.name} <span style="color:rgba(255,255,255,.4);font-size:13px">${octOf(fullPost.oct).e} ${octOf(fullPost.oct).l}</span></div>
    ${fullPost.caption?`<div class="full-cap">${fullPost.caption}</div>`:''}
  `:''}
  </div>`;

  if(view==='feed'){
    const feed=buildFeed();
    app.innerHTML=hdr+reminderHtml+pillsHtml+feed+nav+full;
  } else if(view==='add'){
    app.innerHTML=hdr+buildAdd()+nav+full;
  } else if(view==='members'){
    app.innerHTML=hdr+buildMembers(memberNames)+nav+full;
  } else if(view==='chat'){
    app.innerHTML=hdr+`<div class="chat-wrap" id="chatWrap">${buildChatMsgs()}<div class="chat-input-wrap">
      <textarea class="chat-input" id="chatIn" placeholder="Say something…" rows="1"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg()}"
      ></textarea>
      <button class="chat-send" onclick="sendChatMsg()">➤</button>
    </div></div>`+nav+full;
    scrollChat();
  }
}

function buildFeed(){
  const feedPosts=filter?posts.filter(p=>p.name===filter):posts;
  if(loadingFeed)return`<div class="content"><div class="loading"><div class="spinner"></div></div></div>`;
  if(!feedPosts.length)return`<div class="content"><div class="empty"><div class="empty-ico">📸</div><div class="empty-title">No moments yet</div><div class="empty-desc">Tap + to share the first moment with your family.</div></div></div>`;
  return`<div class="content"><div class="pad">${feedPosts.map(p=>{
    const c=colorOf(p.name),o=octOf(p.oct);
    const rxnEx=Object.entries(p.reactions||{}).filter(([,n])=>n.length>0)
      .map(([e,n])=>`<button class="rxn-cnt" onclick="doRxn('${p.id}','${e}')">${e} ${n.length}</button>`).join('');
    const isNew=new Date(p.created_at).getTime()>lastSeen;
    return`<div class="card" style="${isNew?'border-color:#F0D8CC':''}" >
      <div class="card-hdr">
        <div class="av" style="background:${c.bg};border-color:${c.br};color:${c.tx}">${p.name[0].toUpperCase()}</div>
        <div style="flex:1"><div class="cname">${p.name}</div><div class="ctime">${ago(p.created_at)}</div></div>
        <span class="oct-tag" style="background:${o.bg};color:${o.tx}">${o.e} ${o.l}</span>
        ${isOwn(p.name)?`<button class="del-btn" onclick="confirmDelete('${p.id}')">🗑️</button>`:''}
      </div>
      ${p.photo_url?`<img class="post-img" src="${p.photo_url}" onclick="setFull('${p.id}')" alt="" loading="lazy">`
        :`<div class="no-img" style="background:${o.bg};border-color:${o.br}"><span style="font-size:15px">${o.e}</span><span class="no-img-txt" style="color:${o.tx}">${o.l}</span></div>`}
      ${p.caption?`<div class="caption">${p.caption}</div>`:''}
      <div class="rxn-row">${rxnEx}${RXNS.map(e=>`<button class="rxn-btn" onclick="doRxn('${p.id}','${e}')">${e}</button>`).join('')}</div>
    </div>`;
  }).join('')}</div></div>`;
}

function buildChatMsgs(){
  if(!messages.length)return`<div class="chat-msgs"><div class="chat-empty"><div style="font-size:40px;margin-bottom:10px">💬</div><div style="font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px">Family Chat</div><div style="font-size:13px">Say something to the family!</div></div></div>`;
  let html='<div class="chat-msgs" id="chatMsgs">';
  let lastDay='';
  messages.forEach(m=>{
    const day=fmtDay(m.created_at);
    if(day!==lastDay){html+=`<div class="day-divider">${day}</div>`;lastDay=day}
    const own=isOwn(m.name),c=colorOf(m.name);
    html+=`<div class="msg-row${own?' own':''}">
      ${!own?`<div class="msg-av" style="background:${c.bg};border-color:${c.br};color:${c.tx}">${m.name[0].toUpperCase()}</div>`:''}
      <div class="msg-body">
        ${!own?`<div class="msg-name">${m.name}</div>`:''}
        <div class="msg-bubble">${m.text}${own?`<button onclick="confirmDeleteMsg('${m.id}')" style="background:none;border:none;color:rgba(255,255,255,.5);font-size:11px;cursor:pointer;margin-left:6px;padding:0">✕</button>`:''}</div>
        <div class="msg-time">${fmtTime(m.created_at)}</div>
      </div>
    </div>`;
  });
  return html+'</div>';
}

function buildAdd(){
  const paRow=!showNameIn
    ?`<div class="posting-as"><div><div class="pa-label">Posting as</div><div class="pa-name">${myName}</div></div><button class="change-btn" onclick="showChange()">Change</button></div>`
    :`<div style="margin-bottom:14px"><label class="lbl">Your name</label><input id="nameIn" value="${myName}" placeholder="e.g. Omar" autocapitalize="words" autocorrect="off" oninput="chkSub()"></div>`;
  return`<div class="content"><div class="add-wrap">
    <div class="page-ttl">Share a moment</div>
    ${paRow}
    <div class="photo-row">
      <button class="photo-btn" onclick="document.getElementById('cameraIn').click()"><span class="photo-btn-ico">📷</span><span class="photo-btn-txt">Camera</span></button>
      <button class="photo-btn" onclick="document.getElementById('galleryIn').click()"><span class="photo-btn-ico">🖼️</span><span class="photo-btn-txt">Gallery</span></button>
    </div>
    ${draftPhoto?`<div class="draft-wrap"><img class="draft-img" src="${draftPhoto}" alt=""><button class="remove-img" onclick="rmPhoto()">✕ Remove</button></div>`:''}
    <label class="lbl">Occasion</label>
    <div class="oct-row">${OCTS.map(o=>`<button class="oct-btn${selOct===o.id?' on':''}" onclick="pickOct('${o.id}')">${o.e} ${o.l}</button>`).join('')}</div>
    <label class="lbl">Caption (optional)</label>
    <textarea id="captIn" placeholder="Say something…"></textarea>
    <button class="btn" id="subBtn" onclick="submitPost()" ${showNameIn?'disabled':''}>Share with family ❤️</button>
  </div></div>`;
}

function buildMembers(memberNames){
  return`<div class="content"><div class="add-wrap">
    <div class="page-ttl">Family members</div>
    ${!memberNames.length?`<div class="empty"><div class="empty-ico">👨‍👩‍👧‍👦</div><div class="empty-title">No members yet</div></div>`:
    memberNames.map(n=>{
      const c=colorOf(n),ps=posts.filter(p=>p.name===n),last=ps[0];
      const days=last?(Date.now()-new Date(last.created_at).getTime())/86400000:999;
      const streak=days<1?' 🔥 Active today':days<3?` 🌟 ${Math.floor(days)}d ago`:'';
      return`<div class="member-card">
        <div class="av" style="width:46px;height:46px;border-radius:23px;font-size:18px;background:${c.bg};border-color:${c.br};color:${c.tx}">${n[0].toUpperCase()}</div>
        <div style="flex:1">
          <div class="member-name">${n}${isOwn(n)?' <span style="font-size:11px;font-weight:400;color:#9B8A78">(you)</span>':''}${streak?`<span class="streak">${streak}</span>`:''}</div>
          <div class="member-meta">${ps.length} moment${ps.length!==1?'s':''}${last?' · last '+ago(last.created_at):''}</div>
        </div>
      </div>`;
    }).join('')}
  </div></div>`;
}

function renderOnboarding(app){
  app.innerHTML=`<div class="ob">
    <div class="ob-brand">عيلتنا</div>
    <div class="ob-title">Our Family</div>
    <div class="ob-desc">Your family's private space — no chat noise, no groups. Just your people sharing moments.</div>
    <div class="feat"><span class="feat-ico">📸</span><span class="feat-txt">Share photos without the chat noise</span></div>
    <div class="feat"><span class="feat-ico">💬</span><span class="feat-txt">Family chat, just for your family</span></div>
    <div class="feat"><span class="feat-ico">❤️</span><span class="feat-txt">React to moments instantly</span></div>
    <div class="feat"><span class="feat-ico">📅</span><span class="feat-txt">Get reminded to share when you haven't</span></div>
    <label class="lbl" style="margin-top:22px;align-self:flex-start;max-width:320px;width:100%">What's your name?</label>
    <input id="obIn" style="max-width:320px" placeholder="e.g. Omar" oninput="obChk()" autocapitalize="words" autocorrect="off">
    <button class="btn" id="obBtn" style="max-width:320px" onclick="join()" disabled>Join the family →</button>
  </div>`;
}

// ─── Chat helpers ─────────────────────────────────────────────────────────────
function scrollChat(){
  setTimeout(()=>{const el=document.getElementById('chatMsgs');if(el)el.scrollTop=el.scrollHeight},50);
}
function markMsgsSeen(){
  unreadMsgs=0;
  lastMsgSeen=Date.now();
  lsSet('ayl_msgseen',String(lastMsgSeen));
}
function renderChat(){
  const wrap=document.getElementById('chatWrap');
  if(!wrap)return;
  const inputEl=document.getElementById('chatIn');
  const inputVal=inputEl?inputEl.value:'';
  const msgsHtml=buildChatMsgs();
  const firstChild=wrap.firstChild;
  if(firstChild)wrap.removeChild(firstChild);
  const div=document.createElement('div');
  div.innerHTML=msgsHtml;
  wrap.insertBefore(div.firstChild,wrap.firstChild);
  scrollChat();
  const newInput=document.getElementById('chatIn');
  if(newInput)newInput.value=inputVal;
}

async function sendChatMsg(){
  const el=document.getElementById('chatIn');
  const txt=(el?.value||'').trim();
  if(!txt||!myName)return;
  el.value='';el.style.height='auto';
  await sendMsg(txt);
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function obChk(){const v=(document.getElementById('obIn')||{}).value||'';const b=document.getElementById('obBtn');if(b){b.disabled=!v.trim();b.style.opacity=v.trim()?'1':'.35'}}
function join(){const n=(document.getElementById('obIn')?.value||'').trim();if(!n)return;myName=n;lsSet('ayl_name',n);initNotifs();render()}
function setF(n){filter=n==='All'?null:(filter===n?null:n);render()}
function pickOct(id){selOct=id;render()}
function showChange(){showNameIn=true;render()}
function rmPhoto(){draftPhoto=null;render()}
function chkSub(){const v=(document.getElementById('nameIn')||{}).value||'';const b=document.getElementById('subBtn');if(b)b.disabled=!v.trim()}
function goView(v_){view=v_;if(v_==='add'){draftPhoto=null;selOct='everyday';showNameIn=false}if(v_==='chat'){markMsgsSeen()}render();if(v_==='chat')scrollChat()}
function setFull(id){fullPost=id?posts.find(p=>p.id===id):null;render()}
function confirmDelete(id){if(!confirm('Delete this moment?'))return;deletePost(id)}
function confirmDeleteMsg(id){
  if(!confirm('Delete this message?'))return;
  if(!USE_SB){
    messages=messages.filter(m=>m.id!==id);
    saveMsgsLocal();renderChat();return;
  }
  sb.from('messages').delete().eq('id',id).then(()=>loadMessages().then(()=>renderChat()));
}

function doRxn(id,emoji){
  const name=myName||'You';
  const p=posts.find(p=>p.id===id);if(!p)return;
  const rxn={...(p.reactions||{})};
  rxn[emoji]=rxn[emoji]?[...rxn[emoji]]:[];
  const i=rxn[emoji].indexOf(name);
  if(i>-1){rxn[emoji].splice(i,1);if(!rxn[emoji].length)delete rxn[emoji]}
  else rxn[emoji].push(name);
  updateReactions(id,rxn);
  if(!USE_SB)render();
}

async function submitPost(){
  const name=(showNameIn?(document.getElementById('nameIn')?.value||''):myName).trim();
  const caption=((document.getElementById('captIn')?.value)||'').trim();
  if(!name)return;
  document.getElementById('uploading').className='uploading show';
  try{
    let photoURL=null;
    if(draftPhoto)photoURL=await uploadPhoto(draftPhoto);
    await addPost(name,caption,photoURL,selOct);
    if(name!==myName){myName=name;lsSet('ayl_name',name)}
    draftPhoto=null;selOct='everyday';showNameIn=false;
    if(!USE_SB)await loadPosts();
    view='feed';render();
    
  }catch(e){alert('Something went wrong. Try again.')}
  finally{document.getElementById('uploading').className='uploading'}
}

// ─── File inputs ──────────────────────────────────────────────────────────────
document.getElementById('galleryIn').onchange=async function(){
  const f=this.files[0];if(!f)return;
  draftPhoto=await compress(f);this.value='';
  if(view!=='add')view='add';render();
};
document.getElementById('cameraIn').onchange=async function(){
  const f=this.files[0];if(!f)return;
  draftPhoto=await compress(f);this.value='';
  if(view!=='add')view='add';render();
};

// ─── Service worker ───────────────────────────────────────────────────────────
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
