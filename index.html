<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عيلتنا">
<meta name="theme-color" content="#ffffff">
<title>عيلتنا · Our Family</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════════
   THEME SYSTEM — 5 themes, all warm & accessible
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* Warm Terracotta (default) */
  --bg:#FAF8F3;--bg2:#F3EFE7;--card:#FFFFFF;--card2:#FDF9F5;
  --pri:#C4622D;--pri-light:#FAECE7;--pri-dark:#A04E22;
  --txt:#1A1208;--txt2:#7A6A5A;--txt3:#B8A898;
  --bd:#EAE2D6;--bd2:#DDD4C4;
  --accent:#E8A87C;--accent2:#F0C89A;
  --shadow:rgba(196,98,45,.12);--shadow2:rgba(26,18,8,.08);
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;
  --r:18px;--r2:12px;--r3:8px;
  --font-display:'Lora',Georgia,serif;
  --font-body:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  --fs-base:15px;--fs-sm:13px;--fs-xs:11px;--fs-lg:17px;--fs-xl:22px;
  --transition:0.18s cubic-bezier(0.4,0,0.2,1);
  --nav-h:68px;
}

[data-theme="midnight"] {
  --bg:#0F0E17;--bg2:#1A1826;--card:#1E1D2E;--card2:#252438;
  --pri:#8B5CF6;--pri-light:#2D1F4E;--pri-dark:#7C3AED;
  --txt:#F4F3FF;--txt2:#9B98C5;--txt3:#5C5A7A;
  --bd:#2D2B45;--bd2:#3A3860;
  --accent:#C4B5FD;--accent2:#A78BFA;
  --shadow:rgba(139,92,246,.18);--shadow2:rgba(0,0,0,.35);
  --green:#34D399;--red:#F87171;--blue:#60A5FA;
}

[data-theme="rose"] {
  --bg:#FFF5F7;--bg2:#FFE8ED;--card:#FFFFFF;--card2:#FFF0F3;
  --pri:#E11D6A;--pri-light:#FFE4EE;--pri-dark:#BE185D;
  --txt:#1A0A10;--txt2:#7A4055;--txt3:#C49AAA;
  --bd:#F5CEDD;--bd2:#EDADC3;
  --accent:#F9A8C9;--accent2:#FBC9DA;
  --shadow:rgba(225,29,106,.12);--shadow2:rgba(26,10,16,.08);
}

[data-theme="forest"] {
  --bg:#F4F7F2;--bg2:#E8F0E4;--card:#FFFFFF;--card2:#F0F5EE;
  --pri:#2D7A3A;--pri-light:#E0F2E3;--pri-dark:#1F5C2A;
  --txt:#0D1A10;--txt2:#4A6B50;--txt3:#9AB8A0;
  --bd:#C8DEC9;--bd2:#B0CEB4;
  --accent:#6BAE75;--accent2:#98CC9E;
  --shadow:rgba(45,122,58,.12);--shadow2:rgba(13,26,16,.08);
}

[data-theme="ocean"] {
  --bg:#F0F6FF;--bg2:#E0EEFF;--card:#FFFFFF;--card2:#EBF3FF;
  --pri:#1A6FC4;--pri-light:#DCEEFF;--pri-dark:#135BA0;
  --txt:#071525;--txt2:#3A5A7A;--txt3:#8AAAC5;
  --bd:#C2D8EF;--bd2:#A8C4E0;
  --accent:#60A5FA;--accent2:#93C5FD;
  --shadow:rgba(26,111,196,.12);--shadow2:rgba(7,21,37,.08);
}

/* ══════════════════════════════════════════════════════════════════
   RESETS & BASE
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font-body);color:var(--txt);font-size:var(--fs-base)}
#app{
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  position:relative;max-width:540px;margin:0 auto;background:var(--bg);
  transition:background var(--transition),color var(--transition);
}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
input,textarea{font-family:var(--font-body)}

/* ══════════════════════════════════════════════════════════════════
   SCROLLBARS
   ══════════════════════════════════════════════════════════════════ */
.scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.scrollable::-webkit-scrollbar{width:4px}
.scrollable::-webkit-scrollbar-track{background:transparent}
.scrollable::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}

/* ══════════════════════════════════════════════════════════════════
   HEADER
   ══════════════════════════════════════════════════════════════════ */
.hdr{
  background:var(--card);border-bottom:1.5px solid var(--bd);
  padding:10px 16px 10px;padding-top:calc(10px + env(safe-area-inset-top));
  flex-shrink:0;position:relative;z-index:10;
  box-shadow:0 2px 12px var(--shadow2);
}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand-arabic{
  font-family:var(--font-display);font-size:24px;font-weight:700;
  color:var(--pri);letter-spacing:-0.5px;line-height:1;
}
.brand-eng{font-size:var(--fs-xs);color:var(--txt3);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-top:2px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.2);display:inline-block;vertical-align:middle;margin-left:5px;position:relative;top:-1px}
.brand-dot.offline{background:var(--txt3);box-shadow:none}
.hdr-right{display:flex;align-items:center;gap:8px}
.new-badge{
  background:var(--pri);color:#fff;border-radius:20px;
  padding:3px 10px;font-size:var(--fs-xs);font-weight:800;
  animation:badge-pop .3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes badge-pop{from{transform:scale(0)}to{transform:scale(1)}}
.theme-btn{
  width:34px;height:34px;border-radius:50%;background:var(--bg2);
  border:1.5px solid var(--bd);display:flex;align-items:center;
  justify-content:center;font-size:16px;transition:transform .2s;
}
.theme-btn:active{transform:scale(0.9)}

/* ══════════════════════════════════════════════════════════════════
   THEME PICKER SHEET
   ══════════════════════════════════════════════════════════════════ */
.sheet-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;
  display:none;align-items:flex-end;backdrop-filter:blur(3px);
}
.sheet-overlay.show{display:flex}
.sheet{
  width:100%;background:var(--card);border-radius:24px 24px 0 0;
  padding:0 0 calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .35s cubic-bezier(0.32,0.72,0,1);
}
.sheet-overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--bd2);margin:12px auto 20px}
.sheet-title{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:700;text-align:center;margin-bottom:20px;color:var(--txt)}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:0 20px}
.theme-swatch{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;padding:0;
}
.theme-circle{
  width:52px;height:52px;border-radius:50%;border:3px solid transparent;
  transition:transform .2s,border-color .2s;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.theme-circle.active{border-color:var(--pri)}
.theme-circle.active::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.35);border-radius:50%;
  color:#fff;font-size:18px;font-weight:700;
}
.theme-swatch:active .theme-circle{transform:scale(0.9)}
.theme-name{font-size:var(--fs-xs);color:var(--txt2);font-weight:700;text-align:center}
.font-row{display:flex;gap:10px;padding:16px 20px 0}
.font-btn{
  flex:1;padding:12px;border-radius:var(--r2);border:1.5px solid var(--bd);
  background:var(--bg2);font-size:var(--fs-sm);font-weight:700;color:var(--txt2);
  transition:all .2s;
}
.font-btn.active{background:var(--pri-light);border-color:var(--pri);color:var(--pri)}
.size-row{display:flex;gap:10px;padding:12px 20px 0;align-items:center}
.size-lbl{font-size:var(--fs-sm);font-weight:700;color:var(--txt2);flex-shrink:0}
.size-track{flex:1;height:6px;background:var(--bd);border-radius:3px;position:relative}
.size-btns{display:flex;gap:8px}
.size-step{
  width:38px;height:38px;border-radius:var(--r3);background:var(--bg2);
  border:1.5px solid var(--bd);font-size:var(--fs-sm);font-weight:800;color:var(--txt);
  display:flex;align-items:center;justify-content:center;
}
.size-step:active{background:var(--pri-light)}

/* ══════════════════════════════════════════════════════════════════
   FILTER PILLS
   ══════════════════════════════════════════════════════════════════ */
.pills-wrap{
  background:var(--card);border-bottom:1.5px solid var(--bd);
  padding:8px 14px;flex-shrink:0;
}
.pills{display:flex;gap:6px}
.pill{
  padding:7px 15px;border-radius:30px;border:1.5px solid var(--bd);
  font-size:var(--fs-sm);color:var(--txt2);white-space:nowrap;
  background:transparent;font-weight:600;transition:all .18s;flex-shrink:0;
}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill:active{transform:scale(0.95)}

/* ══════════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
   ══════════════════════════════════════════════════════════════════ */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;position:relative;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.main::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.content{flex:1;padding:14px 12px 20px;display:flex;flex-direction:column;gap:14px}

/* ══════════════════════════════════════════════════════════════════
   POST CARD
   ══════════════════════════════════════════════════════════════════ */
.card{
  background:var(--card);border-radius:var(--r);border:1.5px solid var(--bd);
  overflow:hidden;transition:border-color .3s;
  box-shadow:0 2px 10px var(--shadow2);
  animation:card-in .35s cubic-bezier(0.34,1.2,0.64,1) both;
}
.card.is-new{border-color:var(--accent)}
@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
.av{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px;
  border-width:2px;border-style:solid;flex-shrink:0;
  font-family:var(--font-display);
}
.av-sm{width:28px;height:28px;font-size:11px;border-width:1.5px}
.av-xs{width:22px;height:22px;font-size:10px;border-width:1.5px}
.card-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.cname{font-size:var(--fs-base);font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ctime{font-size:var(--fs-xs);color:var(--txt3);margin-top:1px}
.oct-tag{
  padding:4px 8px;border-radius:20px;font-size:10px;
  font-weight:700;white-space:nowrap;flex-shrink:0;max-width:100px;
  overflow:hidden;text-overflow:ellipsis;
}
.more-btn{
  width:32px;height:32px;border-radius:50%;background:none;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--txt3);transition:background .2s;
  margin-left:auto;
}
.more-btn:active{background:var(--bg2)}

/* Post image */
.post-img-wrap{position:relative;overflow:hidden;background:var(--bg2)}
.post-img{width:100%;max-height:360px;object-fit:cover;cursor:pointer;transition:transform .3s}
.post-img:active{transform:scale(0.99)}
.no-img{
  height:52px;display:flex;align-items:center;justify-content:center;
  gap:8px;border-top:1px solid;border-bottom:1px solid;
}
.no-img-txt{font-size:var(--fs-sm);font-weight:700}

/* Caption */
.caption{
  padding:10px 14px 6px;font-size:var(--fs-base);line-height:1.65;color:var(--txt);
  font-family:var(--font-display);
}
.caption strong{font-weight:700}
.caption em{font-style:italic}
.caption .mention{color:var(--pri);font-weight:700;cursor:pointer}

/* ══════════════════════════════════════════════════════════════════
   REACTIONS — OPTIMIZED
   ══════════════════════════════════════════════════════════════════ */
.rxn-wrap{padding:8px 12px 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rxn-pill{
  display:flex;align-items:center;gap:4px;padding:5px 10px;
  border-radius:30px;border:1.5px solid var(--bd);background:var(--bg2);
  font-size:var(--fs-sm);font-weight:700;color:var(--txt2);
  transition:transform .15s cubic-bezier(0.34,1.56,0.64,1),
             background .15s,border-color .15s,color .15s;
  position:relative;user-select:none;
  /* GPU layer for zero-lag */
  will-change:transform;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
}
.rxn-pill.mine{background:var(--pri-light);border-color:var(--pri);color:var(--pri)}
.rxn-pill:active{transform:scale(0.88) translateZ(0)}
.rxn-pill.pop{animation:rxn-pop .3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes rxn-pop{0%{transform:scale(1) translateZ(0)}50%{transform:scale(1.25) translateZ(0)}100%{transform:scale(1) translateZ(0)}}
.rxn-emoji{font-size:16px;line-height:1}
.rxn-count{font-size:var(--fs-xs);font-weight:800;min-width:12px;text-align:center}

/* Reaction bar (add reaction) */
.rxn-add-row{display:flex;gap:2px;padding:0 10px 8px;flex-wrap:wrap}
.rxn-add-btn{
  padding:5px 7px;font-size:18px;line-height:1;background:none;border:none;
  border-radius:var(--r3);transition:transform .12s,background .12s;
  will-change:transform;transform:translateZ(0);
}
.rxn-add-btn:active{transform:scale(0.8) translateZ(0);background:var(--bg2)}

/* Who reacted tooltip */
.rxn-who{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(0.85);
  background:#1A1208;color:#fff;border-radius:var(--r3);
  padding:6px 11px;font-size:var(--fs-xs);white-space:normal;
  word-break:break-word;text-align:center;
  pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;
  z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.4);
  width:max-content;max-width:160px;line-height:1.4;
}
.rxn-pill:hover .rxn-who,.rxn-pill.show-who .rxn-who{opacity:1;transform:translateX(-50%) scale(1)}

/* ══════════════════════════════════════════════════════════════════
   COMMENTS SECTION
   ══════════════════════════════════════════════════════════════════ */
.comments-section{border-top:1px solid var(--bd)}
.comments-toggle{
  display:flex;align-items:center;gap:6px;padding:10px 14px;
  background:none;border:none;width:100%;text-align:left;
  font-size:var(--fs-sm);font-weight:700;color:var(--txt2);
  transition:color .15s;
}
.comments-toggle:active{color:var(--pri)}
.comments-toggle-ico{font-size:14px;transition:transform .2s}
.comments-toggle.open .comments-toggle-ico{transform:rotate(90deg)}
.comment-count-badge{
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:10px;padding:1px 7px;font-size:var(--fs-xs);
  font-weight:800;color:var(--txt2);
}

.comments-body{display:none;padding:0 0 4px}
.comments-body.open{display:block}

/* Individual comment */
.comment{
  display:flex;gap:8px;padding:8px 12px 4px;
  animation:cmt-in .2s ease both;
}
@keyframes cmt-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.comment.reply{padding-left:40px}
.comment.reply-l2{padding-left:64px}
.comment-body{flex:1;min-width:0}
.comment-bubble{
  background:var(--bg2);border-radius:0 var(--r) var(--r) var(--r);
  padding:9px 12px;font-size:var(--fs-sm);line-height:1.6;
  border:1px solid var(--bd);
}
.comment-name{font-size:var(--fs-xs);font-weight:800;color:var(--pri);margin-bottom:3px}
.comment-txt{color:var(--txt);word-break:break-word}
.comment-txt .mention{color:var(--pri);font-weight:700}
.comment-img{margin-top:7px;border-radius:var(--r2);max-height:160px;object-fit:cover;cursor:pointer}
.comment-meta{
  display:flex;align-items:center;gap:10px;padding:4px 2px;
  flex-wrap:wrap;
}
.comment-time{font-size:var(--fs-xs);color:var(--txt3)}
.comment-action{
  font-size:var(--fs-xs);font-weight:700;color:var(--txt3);
  background:none;border:none;padding:2px 4px;border-radius:4px;
  transition:color .15s;
}
.comment-action:active{color:var(--pri)}
.comment-rxn-row{display:flex;gap:2px;align-items:center;margin-left:auto}
.comment-rxn{
  font-size:13px;padding:2px 3px;background:none;border:none;
  border-radius:4px;transition:transform .12s;
  will-change:transform;transform:translateZ(0);
}
.comment-rxn:active{transform:scale(0.75) translateZ(0)}

/* Comment image attachment */
.cmt-img-preview{
  position:relative;display:inline-block;margin:6px 12px;
}
.cmt-img-preview img{width:80px;height:80px;object-fit:cover;border-radius:var(--r2);border:2px solid var(--bd)}
.cmt-img-rm{
  position:absolute;top:-5px;right:-5px;width:20px;height:20px;
  border-radius:50%;background:var(--red);color:#fff;
  border:none;font-size:11px;display:flex;align-items:center;justify-content:center;
}

/* Load more comments */
.load-more-cmt{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;background:none;border:none;width:100%;
  font-size:var(--fs-sm);font-weight:700;color:var(--pri);
  border-top:1px solid var(--bd);transition:background .15s;
}
.load-more-cmt:active{background:var(--pri-light)}

/* Comment input */
.comment-input-wrap{
  display:flex;gap:8px;align-items:flex-end;
  padding:8px 10px 10px;border-top:1px solid var(--bd);
  background:var(--card);
}
.comment-input-inner{flex:1;position:relative}
.comment-input{
  width:100%;background:var(--bg2);border:1.5px solid var(--bd);
  border-radius:22px;padding:9px 40px 9px 14px;
  font-size:var(--fs-sm);color:var(--txt);outline:none;
  resize:none;max-height:80px;line-height:1.4;
  transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
.comment-input:focus{border-color:var(--pri)}
.comment-img-btn{
  position:absolute;right:8px;bottom:8px;background:none;border:none;
  font-size:18px;padding:2px;opacity:0.5;transition:opacity .15s;
}
.comment-img-btn:active{opacity:1}
.comment-send{
  width:38px;height:38px;border-radius:50%;background:var(--pri);
  border:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-shrink:0;
  transition:transform .15s,opacity .15s;opacity:0.4;
}
.comment-send.active{opacity:1}
.comment-send:active{transform:scale(0.9)}
.replying-to{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;background:var(--pri-light);
  border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
  font-size:var(--fs-xs);color:var(--pri);font-weight:700;
}
.replying-to button{background:none;border:none;font-size:14px;color:var(--pri);padding:0;margin-left:auto}

/* Typing indicator */
.typing-indicator{
  display:none;align-items:center;gap:8px;padding:6px 14px 8px;
  font-size:var(--fs-xs);color:var(--txt3);
}
.typing-indicator.show{display:flex}
.typing-dots{display:flex;gap:3px}
.typing-dot{
  width:5px;height:5px;border-radius:50%;background:var(--txt3);
  animation:typing-bounce 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}

function getColor(name) {

    const allNames = [...new Set(posts.map(p=>p.name))];
    const idx = allNames.indexOf(name);
    nameColors[name] = MEMBER_COLORS[(idx>=0?idx:Object.keys(nameColors).length) % MEMBER_COLORS.length];
  }
  return nameColors[name];
}

function getOct(id) { return OCCASIONS.find(o=>o.id===id)||OCCASIONS[0]; }
function isOwn(n) { return myName && myName.trim().toLowerCase() === n.trim().toLowerCase(); }

function ago(iso) {
  const d = Date.now() - new Date(iso).getTime();
  const m = Math.floor(d/60000), h = Math.floor(d/3600000), dy = Math.floor(d/86400000);
  if (m<1) return 'just now';
  if (m<60) return m+'m';
  if (h<24) return h+'h';
  if (dy===1) return 'yesterday';
  return dy+'d ago';
}
function fmtTime(iso) { return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmtDay(iso) {
  const d=new Date(iso), now=new Date();
  if (d.toDateString()===now.toDateString()) return 'Today';
  const yes=new Date(now); yes.setDate(yes.getDate()-1);
  if (d.toDateString()===yes.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
}
function dataURLtoBlob(dataURL) {
  const [h,d] = dataURL.split(','), mime=h.match(/:(.*?);/)[1];
  const b=atob(d), arr=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) arr[i]=b.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function compress(file, maxW=1200) {
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const ratio=Math.min(maxW/img.width,maxW/img.height,1);
        const w=Math.round(img.width*ratio), h=Math.round(img.height*ratio);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.78));
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function parseRichText(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/@(\w+)/g,'<span class="mention">@$1</span>');
}
function totalRxnCount(reactions) {

async function uploadPhoto(dataURL) {
  if (!CLOUDINARY_CLOUD) return dataURL;
  try {
    const blob = dataURLtoBlob(dataURL);
    const fd = new FormData();
    fd.append('file', blob);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
    const data = await res.json();
    return data.secure_url || dataURL;
  } catch { return dataURL; }
}

/* ══════════════════════════════════════════════════════════════════
   REALTIME
   ══════════════════════════════════════════════════════════════════ */
function subscribeRealtime() {
  if (!USE_SB) return;
  sb.channel('posts-ch')
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},async(payload)=>{
      await loadPosts();
      nameColors = {};
      if (view==='feed') {
        refreshFeedSilently();
      }
    }).subscribe();
  sb.channel('msgs-ch')
    .on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{
      await loadMessages();
      if (view==='chat') { renderChatMessages(); scrollChat(); }
      else {
        const newMsgs = messages.filter(m=>new Date(m.created_at).getTime()>lastMsgSeen && !isOwn(m.name));
        if (newMsgs.length) { unreadMsgs += newMsgs.length; updateUnreadBadge(); }
      }
    }).subscribe();
  sb.channel('cmts-ch')
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},async(payload)=>{
      const pid = payload.new?.post_id || payload.old?.post_id;
      if (pid) {
        await loadComments(pid); // always load real data
        renderPostComments(pid);
        updateCommentBadge(pid);
      }
    }).subscribe();
}

/* ══════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════ */
function urlB64ToUint8(b) {
  const p='='.repeat((4-b.length%4)%4);
  const s=(b+p).replace(/-/g,'+').replace(/_/g,'/');
  const r=atob(s); const o=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++) o[i]=r.charCodeAt(i); return o;
}
async function initNotifs() {
  if (!('Notification' in window)||!('serviceWorker' in navigator)) return;
  const p = await Notification.requestPermission();
  if (p!=='granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    if (USE_SB && sub) {
      const j=sub.toJSON();
      await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,auth:j.keys.auth,p256dh:j.keys.p256dh},{onConflict:'endpoint'});
    }
  } catch(e) { console.log('Push failed:',e); }
}

  if (!mine.length) return "You haven't shared anything yet — be the first! 📸";

  if (days>2) return `You haven't posted in ${Math.floor(days)} days — share a moment! 📸`;

}

  const counts = {};
  data.forEach(r => { counts[r.post_id] = (counts[r.post_id]||0) + 1; });

        reactions:{},created_at:new Date().toISOString(),_placeholder:true

    }
  });
}

  else if (view==='add') bodyContent = buildAddScreen();

  else if (view==='chat') bodyContent = buildChatScreen();

  app.innerHTML = hdr + rem_html + pills_html +
    `<div class="main scrollable">${bodyContent}</div>` +
    nav + full + themeSheet;

  // Post-render setup
  if (view==='chat') { setupChatInput(); scrollChat(); }
  if (view==='feed') setupFeedListeners();
  setupThemeSheet();
}

  const newOnes = feedPosts.filter(p=>new Date(p.created_at).getTime()>lastSeen);

  if (existing) return; // already showing
  const banner = document.createElement('div');
  banner.id = 'newPostBanner';
  banner.style.cssText = 'position:sticky;top:10px;left:0;right:0;display:flex;justify-content:center;z-index:25;pointer-events:none;padding:0 16px;margin-bottom:4px;';

/* ══════════════════════════════════════════════════════════════════
   REACTIONS — Optimized
   ══════════════════════════════════════════════════════════════════ */
function buildReactions(p) {
  const rxn = p.reactions || {};
  const pills = Object.entries(rxn).filter(([,n])=>n.length>0).map(([e,names])=>{
    const isMine = names.includes(myName);
    const whoList = names.join(', ');
    return `<button class="rxn-pill${isMine?' mine':''}" data-post="${p.id}" data-emoji="${e}"
      onclick="doReaction('${p.id}','${e}',this)"
      onmouseenter="showWho(this)" onmouseleave="hideWho(this)"
      ontouchstart="showWhoTouch(this)" ontouchend="hideWho(this)">
      <span class="rxn-who">${whoList}</span>
      <span class="rxn-emoji">${e}</span>
      <span class="rxn-count">${names.length}</span>
    </button>`;
  }).join('');

  const addBtns = REACTIONS.map(e=>
    `<button class="rxn-add-btn" data-post="${p.id}" data-emoji="${e}" onclick="doReaction('${p.id}','${e}',this)" aria-label="React ${e}">${e}</button>`
  ).join('');

  return `<div class="rxn-wrap">${pills}</div><div class="rxn-add-row">${addBtns}</div>`;
}

/* ══════════════════════════════════════════════════════════════════
   COMMENTS
   ══════════════════════════════════════════════════════════════════ */
function buildCommentSection(p) {
  const cmts = (comments[p.id]||[]).filter(c=>!c._placeholder);
  const total = (comments[p.id]||[]).length; // use raw length for badge (includes placeholders = real count)
  const isOpen = openComments[p.id];
  const draft = cmtDraft[p.id]||{text:'',photo:null,replyTo:null};
  const page = cmtPages[p.id]||1;
  const topLevel = cmts.filter(c=>!c.parent_id);
  const shown = topLevel.slice(0, page * CMT_PAGE_SIZE);
  const hasMore = topLevel.length > shown.length;

  let cmtBody = '';
  if (isOpen) {
    const cmtList = shown.map(c=>buildComment(p.id, c, cmts, 0)).join('');
    const loadMore = hasMore
      ? `<button class="load-more-cmt" onclick="loadMoreComments('${p.id}')">▼ Load ${Math.min(CMT_PAGE_SIZE, topLevel.length-shown.length)} more comments</button>`
      : '';
    const replyBanner = draft.replyTo
      ? `<div class="replying-to">↩ Replying to ${draft.replyTo.name}<button onclick="clearReply('${p.id}')">✕</button></div>`
      : '';
    const imgPreview = draft.photo
      ? `<div class="cmt-img-preview"><img src="${draft.photo}"><button class="cmt-img-rm" onclick="clearCmtImg('${p.id}')">✕</button></div>`
      : '';
    cmtBody = `<div class="comments-body open" id="cmtbody-${p.id}">
      ${cmtList}${loadMore}
      ${replyBanner}${imgPreview}
      <div class="comment-input-wrap">
        <div class="av av-sm" style="background:${getColor(myName).bg};border-color:${getColor(myName).br};color:${getColor(myName).tx};flex-shrink:0">${myName[0].toUpperCase()}</div>
        <div class="comment-input-inner">
          <textarea class="comment-input" id="cmtinput-${p.id}"
            placeholder="${draft.replyTo?`Reply to ${draft.replyTo.name}…`:'Add a comment…'}"
            rows="1"
            oninput="onCmtInput(this,'${p.id}')"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment('${p.id}')}"
          >${draft.text||''}</textarea>
          <button class="comment-img-btn" onclick="attachCommentImg('${p.id}')" aria-label="Attach photo">📎</button>
        </div>
        <button class="comment-send${draft.text?.trim()||draft.photo?' active':''}" id="cmtsend-${p.id}" onclick="submitComment('${p.id}')">➤</button>
      </div>
    </div>`;
  }

  return `<div class="comments-section">
    <button class="comments-toggle${isOpen?' open':''}" id="cmttoggle-${p.id}" onclick="toggleComments('${p.id}')">
      <span class="comments-toggle-ico">▶</span>
      <span>Comments</span>
      <span class="comment-count-badge" id="cmtbadge-${p.id}">${total}</span>
    </button>
    <div id="cmtsec-${p.id}">${cmtBody}</div>
  </div>`;
}

function buildComment(postId, cmt, allCmts, depth) {
  if (depth > 2) return ''; // max depth
  const c = getColor(cmt.name);
  const replies = allCmts.filter(r=>r.parent_id===cmt.id);
  const repliesHtml = replies.map(r=>buildComment(postId, r, allCmts, depth+1)).join('');
  const rxn = cmt.reactions||{};
  const rxnHtml = CMT_REACTIONS.map(e=>{
    const names = rxn[e]||[];
    const isMine = names.includes(myName);
    return `<button class="comment-rxn${isMine?' mine':''}" 
      onclick="doCmtReaction('${postId}','${cmt.id}','${e}',this)"
      style="${isMine?'opacity:1':'opacity:0.5'}"
      aria-label="${e}">${e}${names.length>0?` <span style="font-size:9px;font-weight:800">${names.length}</span>`:''}
    </button>`;
  }).join('');

  const depthClass = depth===1?'reply':depth===2?'reply-l2':'';

  return `<div class="comment${depthClass?' '+depthClass:''}" id="cmt-${cmt.id}">
    <div class="av av-xs" style="background:${c.bg};border-color:${c.br};color:${c.tx};flex-shrink:0;align-self:flex-start;margin-top:4px">${cmt.name[0].toUpperCase()}</div>
    <div class="comment-body">
      <div class="comment-bubble">
        <div class="comment-name">${cmt.name}</div>
        <div class="comment-txt">${parseRichText(cmt.text)}</div>
        ${cmt.photo_url?`<img class="comment-img" src="${cmt.photo_url}" alt="" loading="lazy" onclick="openImgViewer('${cmt.photo_url}')">`:''}
      </div>
      <div class="comment-meta">
        <span class="comment-time">${ago(cmt.created_at)}</span>
        ${depth < 2 ? `<button class="comment-action" onclick="setReply('${postId}','${cmt.id}','${cmt.name}')">↩ Reply</button>` : ''}
        ${isOwn(cmt.name)?`<button class="comment-action" onclick="deleteComment('${postId}','${cmt.id}')" style="color:var(--red)">Delete</button>`:''}
        <div class="comment-rxn-row">${rxnHtml}</div>
      </div>
    </div>
  </div>${repliesHtml}`;
}

/* Reactions — OPTIMISTIC */
function doReaction(postId, emoji, btn) {
  const name = myName||'You';
  const p = posts.find(p=>p.id===postId);
  if(!p) return;

  // Optimistic update
  const rxn = {...(p.reactions||{})};
  rxn[emoji] = rxn[emoji] ? [...rxn[emoji]] : [];
  const i = rxn[emoji].indexOf(name);
  if (i>-1) { rxn[emoji].splice(i,1); if(!rxn[emoji].length) delete rxn[emoji]; }
  else rxn[emoji].push(name);
  p.reactions = rxn;

  // Animate the button immediately (CSS, no layout thrash)
  btn.classList.add('pop');
  btn.addEventListener('animationend',()=>btn.classList.remove('pop'),{once:true});

  // Re-render just the reaction area without full render
  const card = document.getElementById('post-'+postId);
  if(card) {
    const rxnWrap = card.querySelector('.rxn-wrap');
    const rxnAddRow = card.querySelector('.rxn-add-row');
    if(rxnWrap && rxnAddRow) {
      const newHtml = buildReactions(p);
      const tmp = document.createElement('div');
      tmp.innerHTML = newHtml;
      rxnWrap.replaceWith(tmp.children[0]);
      rxnAddRow.replaceWith(tmp.children[0]);
    }
  }

  // Sync to DB in background
  updateReactions(postId, rxn);
}

function showWho(btn) { btn.classList.add('show-who'); }
function hideWho(btn) { btn.classList.remove('show-who'); }
let whoTimer = null;
function showWhoTouch(btn) {
  clearTimeout(whoTimer);
  btn.classList.add('show-who');
  whoTimer = setTimeout(()=>btn.classList.remove('show-who'),2500);
}

/* Comments */
async function toggleComments(postId) {
  const wasOpen = openComments[postId];
  openComments[postId] = !wasOpen;
  // Always load real comments when opening (replaces placeholders)
  if (!wasOpen) {
    const hasPlaceholders = (comments[postId]||[]).some(c=>c._placeholder);
    if (!comments[postId] || hasPlaceholders) {
      await loadComments(postId);
    }
  }
  const p = posts.find(p=>p.id===postId);
  if(!p) return;
  const card = document.getElementById('post-'+postId);
  if(card) {
    const cs = card.querySelector('.comments-section');
    if(cs) { const tmp=document.createElement('div'); tmp.innerHTML=buildCommentSection(p); cs.replaceWith(tmp.firstChild); }
  }
  if(!wasOpen) setTimeout(()=>document.getElementById('cmtinput-'+postId)?.focus(),150);
}

function onCmtInput(el, postId) {
  el.style.height='auto'; el.style.height=el.scrollHeight+'px';
  if(!cmtDraft[postId]) cmtDraft[postId]={text:'',photo:null,replyTo:null};
  cmtDraft[postId].text = el.value;
  const btn=document.getElementById('cmtsend-'+postId);
  if(btn) btn.className='comment-send'+(el.value.trim()||cmtDraft[postId].photo?' active':'');
}

function setReply(postId, cmtId, name) {
  if(!cmtDraft[postId]) cmtDraft[postId]={text:'',photo:null,replyTo:null};
  cmtDraft[postId].replyTo = {id:cmtId,name};
  // Re-render comments section
  const p = posts.find(p=>p.id===postId);
  if(!p) return;
  const card = document.getElementById('post-'+postId);
  if(card) {
    const cs=card.querySelector('.comments-section');
    if(cs) { const tmp=document.createElement('div'); tmp.innerHTML=buildCommentSection(p); cs.replaceWith(tmp.firstChild); }
  }
  // Focus input
  setTimeout(()=>document.getElementById('cmtinput-'+postId)?.focus(),100);
}

function clearReply(postId) {
  if(cmtDraft[postId]) cmtDraft[postId].replyTo=null;
  const p=posts.find(p=>p.id===postId); if(!p) return;
  const card=document.getElementById('post-'+postId);
  if(card){const cs=card.querySelector('.comments-section');if(cs){const tmp=document.createElement('div');tmp.innerHTML=buildCommentSection(p);cs.replaceWith(tmp.firstChild);}}
}

function attachCommentImg(postId) {
  commentImgTargetPost = postId;
  document.getElementById('commentImgIn').click();
}
function clearCmtImg(postId) {
  if(cmtDraft[postId]) cmtDraft[postId].photo=null;
  const p=posts.find(p=>p.id===postId);if(!p)return;
  const card=document.getElementById('post-'+postId);
  if(card){const cs=card.querySelector('.comments-section');if(cs){const tmp=document.createElement('div');tmp.innerHTML=buildCommentSection(p);cs.replaceWith(tmp.firstChild);}}
}

async function submitComment(postId) {
  const draft = cmtDraft[postId]||{};
  const text = (document.getElementById('cmtinput-'+postId)?.value||draft.text||'').trim();
  if(!text&&!draft.photo) return;
  if(!myName) return;

  let photoURL = null;
  if(draft.photo) {
    document.getElementById('uploading').className='uploading-overlay show';
    photoURL = await uploadPhoto(draft.photo);
    document.getElementById('uploading').className='uploading-overlay';
  }

  const parentId = draft.replyTo?.id||null;
  await addComment(postId, parentId, text, photoURL);

  // Clear draft
  cmtDraft[postId] = {text:'',photo:null,replyTo:null};

  // Re-render comments section
  const p=posts.find(p=>p.id===postId);if(!p)return;
  const card=document.getElementById('post-'+postId);
  if(card){const cs=card.querySelector('.comments-section');if(cs){const tmp=document.createElement('div');tmp.innerHTML=buildCommentSection(p);cs.replaceWith(tmp.firstChild);}}
  updateCommentBadge(postId);
}

function doCmtReaction(postId, cmtId, emoji, btn) {
  const name = myName||'You';
  const cmt = (comments[postId]||[]).find(c=>c.id===cmtId);
  if(!cmt) return;
  const rxn = {...(cmt.reactions||{})};
  rxn[emoji] = rxn[emoji]?[...rxn[emoji]]:[];
  const i=rxn[emoji].indexOf(name);
  if(i>-1){rxn[emoji].splice(i,1);if(!rxn[emoji].length)delete rxn[emoji];}
  else rxn[emoji].push(name);
  cmt.reactions=rxn;

  // Animate
  btn.style.transform='scale(0.7)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>btn.style.transform=''));

  updateCommentRxn(postId, cmtId, rxn);
  renderPostComments(postId);
}

function loadMoreComments(postId) {
  cmtPages[postId]=(cmtPages[postId]||1)+1;
  renderPostComments(postId);
}

function renderPostComments(postId) {
  const p=posts.find(p=>p.id===postId);if(!p||!openComments[postId])return;
  const card=document.getElementById('post-'+postId);
  if(card){const cs=card.querySelector('.comments-section');if(cs){const tmp=document.createElement('div');tmp.innerHTML=buildCommentSection(p);cs.replaceWith(tmp.firstChild);}}
  updateCommentBadge(postId);
}

function updateCommentBadge(postId) {
  const el=document.getElementById('cmtbadge-'+postId);
  if(el) el.textContent = totalCmtCount(postId);
}
function updateUnreadBadge() {
  // Partial re-render of nav area
  const navEl=document.querySelector('.nav');
  if(navEl) navEl.outerHTML=buildNav();
}

/* Rich text tools */
function wrapText(before, after) {
  const ta=document.getElementById('captIn');if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e)||'text';
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
}
function insertMentionCaption(name) {
  const ta=document.getElementById('captIn');if(!ta)return;
  const pos=ta.selectionStart;
  ta.value=ta.value.substring(0,pos)+'@'+name+' '+ta.value.substring(pos);
  ta.focus();
}

function checkSubmit() {
  const v=(document.getElementById('nameIn')?.value||'').trim();
  const b=document.getElementById('subBtn');if(b)b.disabled=!v;
}

/* Add post submit */
async function submitPost() {
  const name = (showNameInput?(document.getElementById('nameIn')?.value||''):myName).trim();
  const caption = (document.getElementById('captIn')?.value||'').trim();
  if(!name) return;
  document.getElementById('uploading').className='uploading-overlay show';
  try {
    let photoURL=null;
    if(draftPhoto) photoURL=await uploadPhoto(draftPhoto);
    await addPost(name,caption,photoURL,selOct);
    if(name!==myName){myName=name;lss('ayl_name',name);}
    draftPhoto=null;selOct='everyday';showNameInput=false;
    if(!USE_SB) await loadPosts();
    view='feed';render();
  } catch(e){alert('Something went wrong. Please try again.');}
  finally{document.getElementById('uploading').className='uploading-overlay';}
}

/* Chat */
function setupChatInput() {
  const inp=document.getElementById('chatIn');
  const btn=document.getElementById('chatSendBtn');
  if(!inp||!btn)return;
  inp.addEventListener('input',()=>{
    inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';
    btn.style.opacity=inp.value.trim()?'1':'0.4';
  });
}
function onChatInput(el) {
  el.style.height='auto';el.style.height=el.scrollHeight+'px';
}
function scrollChat() {
  setTimeout(()=>{const el=document.getElementById('chatMsgsWrap');if(el)el.scrollTop=el.scrollHeight;},60);
}
function markMsgsSeen() {
  unreadMsgs=0; lastMsgSeen=Date.now(); lss('ayl_msgseen',lastMsgSeen);
}
function renderChatMessages() {
  const wrap=document.getElementById('chatMsgsWrap');if(!wrap)return;
  const inp=document.getElementById('chatIn');const v=inp?.value||'';
  wrap.innerHTML=buildChatMessageList();
  scrollChat();
  const newInp=document.getElementById('chatIn');if(newInp)newInp.value=v;
}
async function sendChatMsg() {
  const el=document.getElementById('chatIn');
  const txt=(el?.value||'').trim();
  if(!txt||!myName)return;
  el.value='';el.style.height='auto';
  const btn=document.getElementById('chatSendBtn');if(btn)btn.style.opacity='0.4';
  await sendMsg(txt);
}
async function deleteMsg(id) {
  if(!confirm('Delete this message?'))return;
  if(!USE_SB){messages=messages.filter(m=>m.id!==id);lssj('ayl_msgs',messages);renderChatMessages();return;}
  await sb.from('messages').delete().eq('id',id);
  await loadMessages();renderChatMessages();
}

/* Theme sheet */
function openThemeSheet() {
  const el=document.getElementById('themeOverlay');if(el)el.className='sheet-overlay show';
}
function closeThemeSheet(e) {
  if(e.target.id==='themeOverlay'){const el=document.getElementById('themeOverlay');if(el)el.className='sheet-overlay';}
}
function setTheme(id) {
  applyTheme(id);
  // Re-render swatches only
  const grid=document.querySelector('.theme-grid');
  if(grid){
    grid.innerHTML=THEMES.map(t=>`
      <button class="theme-swatch" onclick="setTheme('${t.id}')">
        <div class="theme-circle${id===t.id?' active':''}" style="background:${t.bg};box-shadow:0 3px 10px rgba(0,0,0,.15)">
          <span style="font-size:22px">${t.emoji}</span>
        </div>
        <div class="theme-name">${t.name}</div>
      </button>`).join('');
  }
}
function setFontSize(size) {
  applyFontSize(size);
  // Re-render size buttons
  document.querySelectorAll('.size-step').forEach(b=>{
    b.className='size-step'+(b.dataset.size===size?' active':'');
  });
}
function setupThemeSheet() {
  // Wire up size buttons with data attrs for active state
  document.querySelectorAll('.size-step').forEach((b,i)=>{
    const sizes=['sm','md','lg'];b.dataset.size=sizes[i];
  });
}

/* File inputs */
document.getElementById('galleryIn').onchange = async function(){
  const f=this.files[0];if(!f)return;
  draftPhoto=await compress(f);this.value='';
  if(view!=='add')view='add';render();
};
document.getElementById('cameraIn').onchange = async function(){
  const f=this.files[0];if(!f)return;
  draftPhoto=await compress(f);this.value='';
  if(view!=='add')view='add';render();
};
document.getElementById('commentImgIn').onchange = async function(){
  const f=this.files[0];if(!f||!commentImgTargetPost)return;
  const dataUrl=await compress(f,600);this.value='';
  if(!cmtDraft[commentImgTargetPost]) cmtDraft[commentImgTargetPost]={text:'',photo:null,replyTo:null};
  cmtDraft[commentImgTargetPost].photo=dataUrl;
  const p=posts.find(p=>p.id===commentImgTargetPost);if(!p)return;
  const card=document.getElementById('post-'+commentImgTargetPost);
  if(card){const cs=card.querySelector('.comments-section');if(cs){const tmp=document.createElement('div');tmp.innerHTML=buildCommentSection(p);cs.replaceWith(tmp.firstChild);}}
};

/* Service Worker */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* Boot */
init();
</script>
